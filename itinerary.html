/* =====================================
   URL 參數讀取 + 日期判斷
===================================== */

function getDayFromURL() {
    const params = new URLSearchParams(window.location.search);
    const dayParam = params.get('day');
    if (dayParam) {
        const dayNum = parseInt(dayParam);
        if (dayNum >= 1 && dayNum <= 6) {
            return dayNum;
        }
    }
    return null;
}

function getTodayDay() {
    // 優先使用 URL 參數
    const urlDay = getDayFromURL();
    if (urlDay !== null) {
        return urlDay;
    }

    // 否則自動判斷日期
    const now = new Date();
    const current = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const start = new Date(2026, 10, 2);
    const end = new Date(2026, 10, 7);

    if (current < start) return 1;
    if (current > end) return 6;

    for (let i = 0; i < days.length; i++) {
        const d = new Date(days[i].date);
        if (current.getTime() === d.getTime()) return days[i].day;
    }
    return 1;
}


/* =====================================
   顯示 Day 按鈕
===================================== */

function renderDayButtons(selectedDay) {

    const box = document.getElementById("daySelector");
    box.innerHTML = "";

    days.forEach(day => {
        const button = document.createElement("button");
        button.className = "day-btn";
        if (day.day === selectedDay) button.classList.add("active");
        button.textContent = "Day " + day.day;
        button.onclick = function() {
            // 點擊按鈕時同時更新 URL（方便分享）
            const url = new URL(window.location);
            url.searchParams.set('day', day.day);
            window.history.pushState({}, '', url);
            renderDay(day.day);
        };
        box.appendChild(button);
    });
}


/* =====================================

===================================== */

    heading.className = "day-heading";
    heading.textContent = "Day " + day.day + "｜" + day.title;

    const gridCols = hasGuideLink ? '1fr 1fr 1fr' : '1fr 1fr';

    let buttonsHtml = '';

    // 自助講解（如果有）
    if (hasGuideLink) {
        buttonsHtml += `
            <a class="spot-btn" href="${guideLink}" style="background:#b89a68; color:white; border-radius:9px; padding:8px 6px; text-align:center; text-decoration:none; font-size:13px; font-weight:bold;">🎧 自助講解</a>
        `;
    }

    // 導遊資料（保留）
    buttonsHtml += `
        <a class="spot-btn" href="spots.html" style="background:#eee8df; color:#514b45; border-radius:9px; padding:8px 6px; text-align:center; text-decoration:none; font-size:13px; font-weight:bold;">📖 導遊資料</a>
    `;

    // 查看地圖（保留）
    buttonsHtml += `
        <a class="map-btn" href="map.html?spot=${encodeURIComponent(event.spot)}" style="background:#657b6d; color:white; border-radius:9px; padding:8px 6px; text-align:center; text-decoration:none; font-size:13px; font-weight:bold;">🗺️ 查看地圖</a>
    `;

    html += `
        <div class="buttons" style="display: grid; grid-template-columns: ${gridCols}; gap: 8px; margin-top: 10px;">
            ${buttonsHtml}
        </div>
    `;
        }

        card.innerHTML = html;
        timeline.appendChild(card);
    });

    container.appendChild(heading);
    container.appendChild(theme);
    container.appendChild(timeline);
}
