/* =====================================
   URL 參數讀取 + 日期判斷
===================================== */

function getDayFromURL() {
    const params = new URLSearchParams(window.location.search);
    const dayParam = params.get('day');
    if (dayParam) {
        const dayNum = parseInt(dayParam);
        if (dayNum >= 1 && dayNum <= 6) {
            return dayNum;
        }
    }
    return null;
}

function getTodayDay() {
    // 優先使用 URL 參數
    const urlDay = getDayFromURL();
    if (urlDay !== null) {
        return urlDay;
    }

    // 否則自動判斷日期
    const now = new Date();
    const current = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const start = new Date(2026, 10, 2);
    const end = new Date(2026, 10, 7);

    if (current < start) return 1;
    if (current > end) return 6;

    for (let i = 0; i < days.length; i++) {
        const d = new Date(days[i].date);
        if (current.getTime() === d.getTime()) return days[i].day;
    }
    return 1;
}


/* =====================================
   顯示 Day 按鈕
===================================== */

function renderDayButtons(selectedDay) {

    const box = document.getElementById("daySelector");
    box.innerHTML = "";

    days.forEach(day => {
        const button = document.createElement("button");
        button.className = "day-btn";
        if (day.day === selectedDay) button.classList.add("active");
        button.textContent = "Day " + day.day;
        button.onclick = function() {
            // 點擊按鈕時同時更新 URL（方便分享）
            const url = new URL(window.location);
            url.searchParams.set('day', day.day);
            window.history.pushState({}, '', url);
            renderDay(day.day);
        };
        box.appendChild(button);
    });
}


/* =====================================
   顯示行程
===================================== */

function renderDay(dayNumber) {

    const day = days.find(d => d.day === dayNumber);
    if (!day) return;

    renderDayButtons(dayNumber);

    document.getElementById("todayDate").textContent =
        day.date.replaceAll("-", "/") + " · " + day.weekday;

    document.getElementById("todayTitle").textContent =
        "Day " + day.day + " · " + day.title;

    const container = document.getElementById("itinerary");
    container.innerHTML = "";

    const heading = document.createElement("div");
    heading.className = "day-heading";
    heading.textContent = "Day " + day.day + "｜" + day.title;

    const theme = document.createElement("div");
    theme.className = "day-theme";
    theme.textContent = day.date + "　" + day.weekday;

    const timeline = document.createElement("div");
    timeline.className = "timeline";

    day.events.forEach(event => {

        const card = document.createElement("div");
        card.className = "event";

        if (event.core) card.classList.add("core");
        if (event.afternoon) card.classList.add("afternoon");

        let html = "";

        if (event.afternoon) {
            html += `<div class="afternoon-label">🌿 下午彈性</div>`;
        }

        html += `<div class="time">${event.time}</div>`;
        html += `<div class="event-title">${event.title}</div>`;

        if (event.note) {
            html += `<div class="event-note">${event.note}</div>`;
        }

        if (event.spot) {
            const guideLink = event.spotLink || null;
            const hasGuideLink = guideLink !== null;
            const gridCols = hasGuideLink ? '1fr 1fr 1fr' : '1fr 1fr';

            let buttonsHtml = '';

            // 自助講解（如果有）
            if (hasGuideLink) {
                buttonsHtml += `
                    <a class="spot-btn" href="${guideLink}" style="background:#b89a68; color:white; border-radius:9px; padding:8px 6px; text-align:center; text-decoration:none; font-size:13px; font-weight:bold;">🎧 自助講解</a>
                `;
            }

            // 導遊資料（保留）
            buttonsHtml += `
                <a class="spot-btn" href="spots.html" style="background:#eee8df; color:#514b45; border-radius:9px; padding:8px 6px; text-align:center; text-decoration:none; font-size:13px; font-weight:bold;">📖 導遊資料</a>
            `;

            // 查看地圖（保留）
            buttonsHtml += `
                <a class="map-btn" href="map.html?spot=${encodeURIComponent(event.spot)}" style="background:#657b6d; color:white; border-radius:9px; padding:8px 6px; text-align:center; text-decoration:none; font-size:13px; font-weight:bold;">🗺️ 查看地圖</a>
            `;

            html += `
                <div class="buttons" style="display: grid; grid-template-columns: ${gridCols}; gap: 8px; margin-top: 10px;">
                    ${buttonsHtml}
                </div>
            `;
        }

        // 處理自訂地圖按鈕（淨係顯示「查看地圖」）
        if (event.customMap) {
            html += `
                <div class="buttons" style="display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px;">
                    <a class="map-btn" href="map.html?spot=${encodeURIComponent(event.customMap)}" style="background:#657b6d; color:white; border-radius:9px; padding:8px 6px; text-align:center; text-decoration:none; font-size:13px; font-weight:bold;">🗺️ 查看地圖</a>
                </div>
            `;
        }

        // 處理鴨子圖片（放在最尾，確保浮在最上層）
        if (event.duck) {
            html += `<img src="${event.duck}" class="duck-corner" alt="小導遊鴨">`;
        }

        card.innerHTML = html;
        timeline.appendChild(card);
    });

    container.appendChild(heading);
    container.appendChild(theme);
    container.appendChild(timeline);

    // ⬇️ 呢兩行要喺 renderDay 函數裏面，先可以攞到 dayNumber
    renderDayNotes(dayNumber);
}


/* ============================================================
   每日備註功能（localStorage，按天數分開儲存）
   ============================================================ */

const DAY_NOTE_KEY_PREFIX = 'nanjing_day_note_';

function getDayNoteKey(dayNumber) {
    return DAY_NOTE_KEY_PREFIX + dayNumber;
}

function loadDayNotes(dayNumber) {
    try {
        const raw = localStorage.getItem(getDayNoteKey(dayNumber));
        return raw ? JSON.parse(raw) : [];
    } catch (e) {
        console.warn('讀取每日備註失敗:', e);
        return [];
    }
}

function saveDayNotes(dayNumber, notes) {
    try {
        localStorage.setItem(getDayNoteKey(dayNumber), JSON.stringify(notes));
    } catch (e) {
        console.warn('儲存每日備註失敗:', e);
    }
}

function renderDayNotes(dayNumber) {
    const notes = loadDayNotes(dayNumber);
    const container = document.getElementById('dayNoteList');

    if (notes.length === 0) {
        container.innerHTML = '<div class="day-note-empty">暫時未有備註，有任何行程更新都可以寫低㗎！</div>';
        return;
    }

    let html = '';
    notes.forEach((note, index) => {
        html += `
            <div class="day-note-item">
                <span class="note-text">📌 ${note}</span>
                <button class="note-edit" data-index="${index}">✏️</button>
                <button class="note-del" data-index="${index}">✕</button>
            </div>
        `;
    });
    container.innerHTML = html;

    container.querySelectorAll('.note-del').forEach(btn => {
        btn.addEventListener('click', function () {
            const idx = parseInt(this.dataset.index);
            deleteDayNote(dayNumber, idx);
        });
    });

    // 新增：編輯按鈕
    container.querySelectorAll('.note-edit').forEach(btn => {
        btn.addEventListener('click', function () {
            const idx = parseInt(this.dataset.index);
            editDayNote(dayNumber, idx);
        });
    });
}

// 新增：編輯每日備註
function editDayNote(dayNumber, index) {
    const notes = loadDayNotes(dayNumber);
    if (index < 0 || index >= notes.length) return;

    const newText = prompt('編輯今日備註：', notes[index]);
    if (newText === null) return; // 用戶取消

    const trimmed = newText.trim();
    if (!trimmed) {
        alert('備註不能為空');
        return;
    }

    notes[index] = trimmed;
    saveDayNotes(dayNumber, notes);
    renderDayNotes(dayNumber);
}

function addDayNote(dayNumber) {
    const input = document.getElementById('dayNoteInput');
    const text = input.value.trim();

    if (!text) {
        alert('請輸入備註內容');
        return;
    }

    const notes = loadDayNotes(dayNumber);
    notes.push(text);
    saveDayNotes(dayNumber, notes);
    input.value = '';
    renderDayNotes(dayNumber);
}

function deleteDayNote(dayNumber, index) {
    const notes = loadDayNotes(dayNumber);
    if (index >= 0 && index < notes.length) {
        notes.splice(index, 1);
        saveDayNotes(dayNumber, notes);
        renderDayNotes(dayNumber);
    }
}

// 綁定事件（只綁一次）
document.getElementById('addDayNoteBtn').addEventListener('click', function () {
    const currentDay = getTodayDay();
    addDayNote(currentDay);
});

document.getElementById('dayNoteInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        const currentDay = getTodayDay();
        addDayNote(currentDay);
    }
});

/* =====================================
   啟動
===================================== */

const todayDay = getTodayDay();
renderDay(todayDay);

</script>
