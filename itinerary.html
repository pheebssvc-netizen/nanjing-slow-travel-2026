/* =====================================
   日期判斷
===================================== */

function getTodayDay() {

    const now = new Date();

    const current =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
        );

    const start =
        new Date(2026, 10, 2);

    const end =
        new Date(2026, 10, 7);


    /* 旅行開始前 → Day 1 */

    if (current < start) {
        return 1;
    }


    /* 旅行結束後 → Day 6 */

    if (current > end) {
        return 6;
    }


    /* 旅行期間 */

    for (let i = 0; i < days.length; i++) {

        const d =
            new Date(days[i].date);

        if (
            current.getTime() === d.getTime()
        ) {
            return days[i].day;
        }

    }

    return 1;
}


/* =====================================
   顯示 Day 按鈕
===================================== */

function renderDayButtons(selectedDay) {

    const box =
        document.getElementById("daySelector");

    box.innerHTML = "";

    days.forEach(day => {

        const button =
            document.createElement("button");

        button.className = "day-btn";

        if (day.day === selectedDay) {
            button.classList.add("active");
        }

        button.textContent =
            "Day " + day.day;

        button.onclick = function() {

            renderDay(day.day);

        };

        box.appendChild(button);

    });

}


/* =====================================
   顯示行程
===================================== */

function renderDay(dayNumber) {

    const day =
        days.find(
            d => d.day === dayNumber
        );

    if (!day) return;


    renderDayButtons(dayNumber);


    document.getElementById("todayDate")
        .textContent =
        day.date.replaceAll("-", "/")
        + " · "
        + day.weekday;


    document.getElementById("todayTitle")
        .textContent =
        "Day "
        + day.day
        + " · "
        + day.title;


    const container =
        document.getElementById("itinerary");

    container.innerHTML = "";


    const heading =
        document.createElement("div");

    heading.className = "day-heading";

    heading.textContent =
        "Day "
        + day.day
        + "｜"
        + day.title;


    const theme =
        document.createElement("div");

    theme.className = "day-theme";

    theme.textContent =
        day.date
        + "　"
        + day.weekday;


    const timeline =
        document.createElement("div");

    timeline.className = "timeline";


    day.events.forEach(event => {

        const card =
            document.createElement("div");

        card.className = "event";


        if (event.core) {
            card.classList.add("core");
        }

        if (event.afternoon) {
            card.classList.add("afternoon");
        }


        let html = "";


        if (event.afternoon) {

            html +=
            `<div class="afternoon-label">
                🌿 下午彈性
            </div>`;

        }


        html +=
        `<div class="time">
            ${event.time}
        </div>`;


        html +=
        `<div class="event-title">
            ${event.title}
        </div>`;


        if (event.note) {

            html +=
            `<div class="event-note">
                ${event.note}
            </div>`;

        }


        if (event.spot) {

            html +=
            `<div class="buttons">

                <a
                    class="spot-btn"
                    href="spots.html">
                    📖 導遊資料
                </a>

                <a
                    class="map-btn"
                    target="_blank"
                    href="https://uri.amap.com/search?keyword=${encodeURIComponent(event.title)}">
                    🗺️ 高德導航
                </a>

            </div>`;

        }


        card.innerHTML = html;

        timeline.appendChild(card);

    });


    container.appendChild(heading);

    container.appendChild(theme);

    container.appendChild(timeline);

}
