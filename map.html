<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>南京景點地圖｜金陵慢遊</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* =========================
           手機底部導航
           ========================= */
        .mobile-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 64px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid #e8e5dc;
            box-shadow: 0 -3px 15px rgba(0,0,0,0.08);
            z-index: 9998;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .mobile-nav a {
            flex: 1;
            height: 64px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #88877f;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-nav a span {
            font-size: 20px;
            line-height: 22px;
        }

        .mobile-nav a small {
            margin-top: 3px;
            font-size: 11px;
            font-weight: 600;
        }

        .mobile-nav a.active {
            color: #607667;
        }

        .mobile-nav a:active {
            transform: scale(0.95);
        }

        body {
            margin: 0;
            padding: 0;
            padding-bottom: 85px;
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: #f7f3eb;
        }

        /* 地圖容器 */
        #map {
            width: 100%;
            height: calc(100vh - 64px - 85px);
            min-height: 500px;
            background: #e5e0d8;
        }

        /* 頂部標題列 */
        .map-header {
            background: linear-gradient(135deg, #657b6d, #879889);
            color: white;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .map-header h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .map-header .back-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
            background: rgba(255,255,255,0.2);
            padding: 6px 14px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
        }

        .map-header .back-btn:active {
            transform: scale(0.95);
        }

        /* 圖例 */
        .legend {
            position: absolute;
            bottom: 90px;
            left: 12px;
            background: rgba(255,255,255,0.92);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
            z-index: 1000;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }

        .legend .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #657b6d;
            border-radius: 50%;
            margin-right: 6px;
        }

        /* 自訂標記顏色 - 用 CSS class 控制 */
        .marker-green {
            background: #657b6d;
            border: 2px solid white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* Leaflet 彈窗優化 */
        .leaflet-popup-content {
            font-size: 14px;
            line-height: 1.6;
            min-width: 180px;
        }

        .leaflet-popup-content strong {
            color: #4d5748;
            font-size: 16px;
        }

        .leaflet-popup-content .addr {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
        }

        /* 載入中 */
        .loading-map {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 64px - 85px);
            min-height: 500px;
            font-size: 18px;
            color: #999;
            background: #f7f3eb;
        }

        /* 重置視野按鈕 */
        .reset-view-btn {
            position: absolute;
            bottom: 160px;
            right: 12px;
            background: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .reset-view-btn:active {
            transform: scale(0.92);
        }

        @media (max-width: 600px) {
            #map {
                height: calc(100vh - 60px - 85px);
                min-height: 400px;
            }

            .map-header h1 {
                font-size: 17px;
            }

            .legend {
                font-size: 11px;
                padding: 8px 12px;
                bottom: 80px;
            }

            .reset-view-btn {
                bottom: 150px;
                width: 38px;
                height: 38px;
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

<!-- 頂部標題列 -->
<div class="map-header">
    <h1>🗺️ 南京景點地圖</h1>
    <a href="index.html" class="back-btn">← 返回</a>
</div>

<!-- 地圖容器 -->
<div id="map"></div>

<!-- 圖例 -->
<div class="legend">
    <span class="dot"></span> 景點標記
</div>

<!-- 重置視野按鈕 -->
<button class="reset-view-btn" id="resetViewBtn" title="顯示所有景點">📍</button>

<!-- 手機底部導航 -->
<nav class="mobile-nav">
    <a href="index.html">
        <span>🏠</span>
        <small>首頁</small>
    </a>
    <a href="itinerary.html">
        <span>📅</span>
        <small>六日行程</small>
    </a>
    <a href="spots.html" class="active">
        <span>📚</span>
        <small>景點百科</small>
    </a>
</nav>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<!-- 載入景點資料 -->
<script src="spots-data.js">
</script>

<script>
    // ============================================================
    // 1. 初始化地圖（南京市中心）
    // ============================================================

    const map = L.map('map', {
        center: [32.06, 118.78],
        zoom: 13,
        zoomControl: true,
        fadeAnimation: true,
        attributionControl: true
    });

    // 使用 OpenStreetMap 圖磚（免費、無需 API Key）
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // ============================================================
    // 2. 自訂標記圖示（綠色圓點）
    // ============================================================

    const greenIcon = L.divIcon({
        className: 'marker-green',
        iconSize: [18, 18],
        popupAnchor: [0, -10]
    });

    // ============================================================
    // 3. 加入所有景點標記
    // ============================================================

    const markers = [];
    const spotMap = {};

    spots.forEach(spot => {
        const marker = L.marker([spot.lat, spot.lng], { icon: greenIcon })
            .addTo(map)
            .bindPopup(`
                <strong>${spot.name}</strong>
                <div class="addr">📍 ${spot.address}</div>
                <div style="margin-top:6px;font-size:13px;color:#657b6d;">🏷️ ${spot.category}</div>
                <div style="margin-top:6px;">
                    <a href="spots.html" style="color:#657b6d;text-decoration:none;font-weight:bold;">📖 景點導遊</a>
                </div>
            `);

        markers.push(marker);
        spotMap[spot.name] = marker;
    });

    // ============================================================
    // 4. 從 URL 參數讀取景點名稱並縮放
    // ============================================================

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    function zoomToSpot(spotName) {
        if (!spotName) return;

        // 嘗試完全匹配
        let marker = spotMap[spotName];
        if (!marker) {
            // 嘗試部分匹配（例如「明孝陵」 vs 「明孝陵（世界文化遺產）」）
            for (const [name, m] of Object.entries(spotMap)) {
                if (name.includes(spotName) || spotName.includes(name)) {
                    marker = m;
                    break;
                }
            }
        }

        if (marker) {
            const latlng = marker.getLatLng();
            map.setView(latlng, 16, {
                animate: true,
                duration: 0.8
            });
            marker.openPopup();
        } else {
            // 如果找不到，縮放到南京市中心
            map.setView([32.06, 118.78], 13);
        }
    }

    // 執行縮放
    const spotParam = getQueryParam('spot');
    if (spotParam) {
        // 等待地圖載入完成後再縮放
        setTimeout(() => {
            zoomToSpot(decodeURIComponent(spotParam));
        }, 400);
    }

    // ============================================================
    // 5. 重置視野按鈕（顯示所有景點）
    // ============================================================

    document.getElementById('resetViewBtn').addEventListener('click', function() {
        if (markers.length === 0) return;

        const group = L.featureGroup(markers);
        const bounds = group.getBounds();

        // 如果只有一個標記，縮放到該點
        if (markers.length === 1) {
            map.setView(markers[0].getLatLng(), 14, { animate: true });
            markers[0].openPopup();
            return;
        }

        map.fitBounds(bounds, {
            padding: [50, 50],
            maxZoom: 14,
            animate: true,
            duration: 0.6
        });
    });

    // ============================================================
    // 6. 響應式處理
    // ============================================================

    // 延遲 invalidateSize 確保地圖正確顯示
    setTimeout(() => {
        map.invalidateSize();
    }, 300);

    window.addEventListener('resize', () => {
        map.invalidateSize();
    });

    console.log('🗺️ 南京景點地圖已載入，共 ' + markers.length + ' 個景點');
</script>

</body>
</html>
