<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>南京景點地圖｜金陵慢遊</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* =========================
           手機底部導航
           ========================= */
        .mobile-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 70px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid #e8e5dc;
            box-shadow: 0 -3px 15px rgba(0,0,0,0.08);
            z-index: 9998;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .mobile-nav a {
            flex: 1;
            height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #88877f;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-nav a span {
            font-size: 22px;
            line-height: 24px;
        }

        .mobile-nav a small {
            margin-top: 3px;
            font-size: 13px;
            font-weight: 600;
        }

        .mobile-nav a.active {
            color: #607667;
        }

        .mobile-nav a:active {
            transform: scale(0.95);
        }

        body {
            margin: 0;
            padding: 0;
            padding-bottom: 95px;
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: #f7f3eb;
            font-size: 18px;
        }

        /* 地圖容器 */
        #map {
            width: 100%;
            height: calc(100vh - 64px - 95px);
            min-height: 500px;
            background: #e5e0d8;
        }

        /* 頂部標題列 */
        .map-header {
            background: linear-gradient(135deg, #657b6d, #879889);
            color: white;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .map-header h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .map-header .back-btn {
            color: white;
            text-decoration: none;
            font-size: 16px;
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
        }

        .map-header .back-btn:active {
            transform: scale(0.95);
        }

        /* 圖例 */
        .legend {
            position: absolute;
            bottom: 120px;
            left: 12px;
            background: rgba(255,255,255,0.92);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
            z-index: 1000;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }

        .legend .row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .legend .row:last-child {
            margin-bottom: 0;
        }

        .legend .dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .legend .dot.green {
            background: #657b6d;
        }

        .legend .dot.hotel {
            background: #c49a6c;
        }

        .legend .dot.food {
            background: #e07b5a;
        }

        /* ===== 免責聲明 ===== */
        .disclaimer {
            position: absolute;
            bottom: 80px;
            left: 12px;
            background: rgba(0,0,0,0.55);
            color: rgba(255,255,255,0.8);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1000;
            pointer-events: none;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }

        /* 自訂標記 */
        .marker-green {
            background: #657b6d;
            border: 2px solid white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .marker-hotel {
            background: #c49a6c;
            border: 2px solid white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }

        .marker-food {
            background: #e07b5a;
            border: 2px solid white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* Leaflet 彈窗優化 */
        .leaflet-popup-content {
            font-size: 16px;
            line-height: 1.7;
            min-width: 180px;
        }

        .leaflet-popup-content strong {
            color: #4d5748;
            font-size: 18px;
        }

        .leaflet-popup-content .addr {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }

        .leaflet-popup-content .tag {
            display: inline-block;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 6px;
            color: white;
        }

        .leaflet-popup-content .tag.spot-tag {
            background: #657b6d;
        }

        .leaflet-popup-content .tag.hotel-tag {
            background: #c49a6c;
        }

        .leaflet-popup-content .tag.food-tag {
            background: #e07b5a;
        }

        .leaflet-popup-content .btn-locate {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 16px;
            background: #c49a6c;
            color: white;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .leaflet-popup-content .btn-locate:active {
            transform: scale(0.95);
        }

        /* 載入中 */
        .loading-map {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 64px - 95px);
            min-height: 500px;
            font-size: 20px;
            color: #999;
            background: #f7f3eb;
        }

        /* 重置視野按鈕 */
        .reset-view-btn {
            position: absolute;
            bottom: 190px;
            right: 12px;
            background: white;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .reset-view-btn:active {
            transform: scale(0.92);
        }

        @media (max-width: 600px) {
            #map {
                height: calc(100vh - 60px - 95px);
                min-height: 400px;
            }

            .map-header h1 {
                font-size: 19px;
            }

            .legend {
                font-size: 13px;
                padding: 10px 14px;
                bottom: 110px;
            }

            .reset-view-btn {
                bottom: 180px;
                width: 42px;
                height: 42px;
                font-size: 19px;
            }

            .leaflet-popup-content {
                font-size: 15px;
            }

            .disclaimer {
                font-size: 11px;
                bottom: 75px;
                left: 12px;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

<!-- 頂部標題列 -->
<div class="map-header">
    <h1>🗺️ 南京景點地圖</h1>
    <a href="index.html" class="back-btn">← 返回</a>
</div>

<!-- 地圖容器 -->
<div id="map"></div>

<!-- 圖例 -->
<div class="legend">
    <div class="row"><span class="dot green"></span> 景點</div>
    <div class="row"><span class="dot hotel"></span> 🏨 酒店（連住5晚）</div>
    <div class="row"><span class="dot food"></span> 🍴 推薦餐廳</div>
</div>

<!-- 免責聲明 -->
<div class="disclaimer">📍 本地圖只顯示大概位置供參考</div>

<!-- 重置視野按鈕 -->
<button class="reset-view-btn" id="resetViewBtn" title="顯示所有景點">📍</button>

<!-- 手機底部導航 -->
<nav class="mobile-nav">
    <a href="index.html">
        <span>🏠</span>
        <small>首頁</small>
    </a>
    <a href="itinerary.html">
        <span>📅</span>
        <small>六日行程</small>
    </a>
    <a href="spots.html" class="active">
        <span>📚</span>
        <small>景點百科</small>
    </a>
</nav>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<!-- 載入景點資料 -->
<script src="spots-data.js">
</script>

<script>
    // ============================================================
    // 1. 初始化地圖（南京市中心）
    // ============================================================

    const map = L.map('map', {
        center: [32.06, 118.78],
        zoom: 13,
        zoomControl: true,
        fadeAnimation: true,
        attributionControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // ============================================================
    // 2. 自訂標記圖示
    // ============================================================

    // 景點標記（綠色）
    const greenIcon = L.divIcon({
        className: 'marker-green',
        iconSize: [18, 18],
        popupAnchor: [0, -10]
    });

    // 酒店標記（啡色 · 較大）
    const hotelIcon = L.divIcon({
        className: 'marker-hotel',
        iconSize: [22, 22],
        popupAnchor: [0, -12],
        html: '🏨'
    });

    // 餐廳標記（橙色 · 較小）
    const foodIcon = L.divIcon({
        className: 'marker-food',
        iconSize: [16, 16],
        popupAnchor: [0, -8]
    });

    // ============================================================
    // 3. 加入所有標記
    // ============================================================

    const allMarkers = [];
    const spotMap = {};
    let hotelMarkerObj = null;
    const restaurantMarkers = [];

    // 3a. 景點標記
    spots.forEach(spot => {
        const marker = L.marker([spot.lat, spot.lng], { icon: greenIcon })
            .addTo(map)
            .bindPopup(`
                <strong>${spot.name}</strong>
                <div class="addr">📍 ${spot.address}</div>
                <div><span class="tag spot-tag">🏷️ ${spot.category}</span></div>
                <div style="margin-top:6px;">
                    <a href="spots.html" style="color:#657b6d;text-decoration:none;font-weight:bold;">📖 景點導遊</a>
                </div>
            `);

        allMarkers.push(marker);
        spotMap[spot.name] = marker;
    });

    // 3b. 酒店標記（從 spots 中搵出酒店）
    const hotelData = spots.find(s => s.name === '夫子廟亞朵酒店');
    if (hotelData) {
        const marker = L.marker([hotelData.lat, hotelData.lng], { icon: hotelIcon })
            .addTo(map)
            .bindPopup(`
                <strong>🏨 夫子廟亞朵酒店</strong>
                <div class="addr">📍 ${hotelData.address}</div>
                <div><span class="tag hotel-tag">🏠 連住5晚</span></div>
                <div style="margin-top:4px;font-size:14px;color:#666;">步行3分鐘到夫子廟核心區</div>
                <div style="margin-top:6px;">
                    <button class="btn-locate" onclick="zoomToHotel()">📍 查看酒店位置</button>
                </div>
            `);

        allMarkers.push(marker);
        hotelMarkerObj = marker;
    }

    // 3c. 餐廳標記（使用 restaurants 陣列）
    if (typeof restaurants !== 'undefined') {
        restaurants.forEach(r => {
            const marker = L.marker([r.lat, r.lng], { icon: foodIcon })
                .addTo(map)
                .bindPopup(`
                    <strong>🍴 ${r.name}</strong>
                    <div style="font-size:14px;color:#8a715c;">${r.feature}</div>
                    <div class="addr">📍 ${r.address}</div>
                    <div><span class="tag food-tag">🍽️ 推薦餐廳</span></div>
                `);

            allMarkers.push(marker);
            restaurantMarkers.push(marker);
        });
    }

    // ============================================================
    // 4. 縮放到酒店（供按鈕呼叫）
    // ============================================================

    function zoomToHotel() {
        if (hotelMarkerObj) {
            const latlng = hotelMarkerObj.getLatLng();
            map.setView(latlng, 17, {
                animate: true,
                duration: 0.8
            });
            hotelMarkerObj.openPopup();
        }
    }

    // ============================================================
    // 5. 從 URL 參數讀取景點名稱並縮放
    // ============================================================

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    function zoomToSpot(spotName) {
        if (!spotName) return;

        // 先嘗試搵景點
        let marker = spotMap[spotName];
        if (!marker) {
            for (const [name, m] of Object.entries(spotMap)) {
                if (name.includes(spotName) || spotName.includes(name)) {
                    marker = m;
                    break;
                }
            }
        }

        // 如果搵唔到景點，試吓搵餐廳
        if (!marker && typeof restaurants !== 'undefined') {
            for (const r of restaurants) {
                if (r.name.includes(spotName) || spotName.includes(r.name)) {
                    const idx = restaurants.indexOf(r);
                    if (idx >= 0 && idx < restaurantMarkers.length) {
                        marker = restaurantMarkers[idx];
                    }
                    break;
                }
            }
        }

        if (marker) {
            const latlng = marker.getLatLng();
            map.setView(latlng, 16, {
                animate: true,
                duration: 0.8
            });
            marker.openPopup();
        } else {
            map.setView([32.06, 118.78], 13);
        }
    }

    // 執行縮放
    const spotParam = getQueryParam('spot');
    if (spotParam) {
        setTimeout(() => {
            zoomToSpot(decodeURIComponent(spotParam));
        }, 500);
    }

    // ============================================================
    // 6. 重置視野按鈕
    // ============================================================

    document.getElementById('resetViewBtn').addEventListener('click', function() {
        if (allMarkers.length === 0) return;

        const group = L.featureGroup(allMarkers);
        const bounds = group.getBounds();

        if (allMarkers.length === 1) {
            map.setView(allMarkers[0].getLatLng(), 14, { animate: true });
            allMarkers[0].openPopup();
            return;
        }

        map.fitBounds(bounds, {
            padding: [50, 50],
            maxZoom: 14,
            animate: true,
            duration: 0.6
        });
    });

    // ============================================================
    // 7. 響應式處理
    // ============================================================

    setTimeout(() => {
        map.invalidateSize();
    }, 300);

    window.addEventListener('resize', () => {
        map.invalidateSize();
    });

    console.log('🗺️ 南京地圖已載入：' +
        spots.length + ' 個景點 + ' +
        (hotelMarkerObj ? '1 間酒店 + ' : '') +
        (typeof restaurants !== 'undefined' ? restaurants.length : 0) + ' 間餐廳');
</script>

</body>
</html>
