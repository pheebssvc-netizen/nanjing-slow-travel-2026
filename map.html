<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>參考地圖｜金陵慢遊 2026</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    background: #f7f3ec;
    color: #40382f;
}

body {
    min-height: 100vh;
}

/* =========================
   Header
========================= */

.header {
    padding: 22px 18px 18px;
    text-align: center;
    background: rgba(255,255,255,0.92);
    border-bottom: 1px solid #e7ded1;
}

.header h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 1px;
}

.header p {
    margin: 7px 0 0;
    font-size: 14px;
    color: #81766b;
}

/* =========================
   Map
========================= */

.map-wrap {
    position: relative;
    width: 100%;
    height: calc(100vh - 175px);
    min-height: 500px;
    background: #e9e4da;
}

#map {
    width: 100%;
    height: 100%;
}

/* =========================
   Legend
========================= */

.legend {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 1000;

    background: rgba(255,255,255,0.94);
    border-radius: 12px;
    padding: 10px 13px;

    box-shadow: 0 3px 12px rgba(0,0,0,0.12);

    font-size: 13px;
    line-height: 1.8;
}

.legend-title {
    font-weight: 700;
    margin-bottom: 3px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
}

.legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #b56d62;
}

.legend-dot.hotel {
    background: #7c8e73;
}

.legend-dot.airport {
    background: #7c8495;
}

/* =========================
   Popup
========================= */

.popup-box {
    min-width: 190px;
    max-width: 250px;
}

.popup-number {
    font-size: 12px;
    color: #a28b78;
    margin-bottom: 3px;
}

.popup-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 6px;
}

.popup-address {
    font-size: 12px;
    color: #777;
    line-height: 1.5;
    margin-bottom: 10px;
}

.popup-link {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 8px;
    background: #8d6f5d;
    color: white !important;
    text-decoration: none;
    font-size: 13px;
}

/* =========================
   Bottom navigation
========================= */

.bottom-nav {
    height: 78px;
    background: rgba(255,255,255,0.97);

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

    border-top: 1px solid #e7ded1;

    position: relative;
    z-index: 2000;
}

.bottom-nav a {
    text-decoration: none;
    color: #65594f;

    background: #f5efe7;

    padding: 10px 17px;
    border-radius: 22px;

    font-size: 13px;
    white-space: nowrap;
}

.bottom-nav a.active {
    background: #8d6f5d;
    color: white;
}

/* =========================
   Mobile
========================= */

@media (max-width: 600px) {

    .header {
        padding: 17px 14px 14px;
    }

    .header h1 {
        font-size: 22px;
    }

    .header p {
        font-size: 13px;
    }

    .map-wrap {
        height: calc(100vh - 150px);
        min-height: 450px;
    }

    .legend {
        top: 10px;
        left: 10px;
        padding: 8px 10px;
        font-size: 12px;
    }

    .bottom-nav {
        height: 72px;
        gap: 7px;
        padding: 0 8px;
    }

    .bottom-nav a {
        padding: 9px 12px;
        font-size: 12px;
    }
}
</style>

<!-- Leaflet -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

</head>

<body>

<!-- =========================
     Header
========================= -->

<header class="header">
    <h1>🗺️ 參考地圖</h1>
    <p>金陵慢遊 2026｜行程相關地點位置一覽</p>
</header>


<!-- =========================
     Map
========================= -->

<div class="map-wrap">

    <div id="map"></div>

    <div class="legend">

        <div class="legend-title">
            📍 地圖說明
        </div>

        <div class="legend-item">
            <span class="legend-dot"></span>
            景點
        </div>

        <div class="legend-item">
            <span class="legend-dot hotel"></span>
            酒店
        </div>

        <div class="legend-item">
            <span class="legend-dot airport"></span>
            機場
        </div>

    </div>

</div>


<!-- =========================
     Bottom navigation
========================= -->

<nav class="bottom-nav">

    <a href="index.html">
        🏠 首頁
    </a>

    <a href="itinerary.html">
        📅 行程
    </a>

    <a href="spots.html">
        📚 景點百科
    </a>

    <a href="afternoon.html">
        🌿 下午漫遊
    </a>

    <a href="map.html" class="active">
        🗺️ 參考地圖
    </a>

</nav>


<!-- Leaflet JS -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<!-- =========================
     Load spots-data.js
========================= -->

<script src="spots-data.js"></script>


<script>

/* =========================================================
   建立地圖
========================================================= */

const map = L.map("map", {
    zoomControl: true,
    attributionControl: true
});


/* =========================================================
   OpenStreetMap
========================================================= */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);


/* =========================================================
   自訂 Marker
========================================================= */

function createMarkerIcon(number, type) {

    let bg = "#b56d62";

    if (type === "住宿") {
        bg = "#7c8e73";
    }

    if (type === "交通樞紐") {
        bg = "#7c8495";
    }

    return L.divIcon({

        className: "",

        html: `
            <div style="
                width:34px;
                height:34px;
                border-radius:50%;
                background:${bg};
                border:3px solid white;
                box-shadow:0 2px 7px rgba(0,0,0,.28);

                display:flex;
                align-items:center;
                justify-content:center;

                color:white;
                font-size:11px;
                font-weight:700;
            ">
                ${String(number).padStart(2, "0")}
            </div>
        `,

        iconSize: [34, 34],
        iconAnchor: [17, 17],
        popupAnchor: [0, -18]

    });
}


/* =========================================================
   加入 25 個地點
========================================================= */

const markers = [];

spots.forEach(spot => {

    if (
        typeof spot.lat !== "number" ||
        typeof spot.lng !== "number"
    ) {
        return;
    }

    const marker = L.marker(
        [spot.lat, spot.lng],
        {
            icon: createMarkerIcon(
                spot.number,
                spot.category
            )
        }
    );


    /* =========================
       Popup
    ========================= */

    const popupHTML = `

        <div class="popup-box">

            <div class="popup-number">
                NO.${String(spot.number).padStart(2, "0")}
            </div>

            <div class="popup-title">
                ${spot.name}
            </div>

            <div class="popup-address">
                ${spot.address || ""}
            </div>

            ${
                spot.number >= 3
                ?
                `
                <a
                    class="popup-link"
                    href="spots.html#${spot.id}"
                >
                    📖 查看景點百科
                </a>
                `
                :
                ""
            }

        </div>

    `;

    marker.bindPopup(popupHTML);

    marker.addTo(map);

    markers.push(marker);

});


/* =========================================================
   自動調整地圖範圍
========================================================= */

if (markers.length > 0) {

    const group = L.featureGroup(markers);

    map.fitBounds(
        group.getBounds(),
        {
            padding: [35, 35]
        }
    );

}


/* =========================================================
   手機體驗
========================================================= */

setTimeout(() => {

    map.invalidateSize();

}, 300);

</script>

</body>
</html>
