<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>南京景點地圖｜金陵慢遊</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .mobile-nav {
            position: fixed; left: 0; right: 0; bottom: 0; height: 70px;
            display: flex; justify-content: space-around; align-items: center;
            background: rgba(255, 255, 255, 0.96); border-top: 1px solid #e8e5dc;
            box-shadow: 0 -3px 15px rgba(0,0,0,0.08); z-index: 9998;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .mobile-nav a {
            flex: 1; height: 70px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-decoration: none;
            color: #88877f; -webkit-tap-highlight-color: transparent;
        }
        .mobile-nav a span { font-size: 22px; line-height: 24px; }
        .mobile-nav a small { margin-top: 3px; font-size: 13px; font-weight: 600; }
        .mobile-nav a.active { color: #607667; }
        .mobile-nav a:active { transform: scale(0.95); }

        body {
            margin: 0; padding: 0; padding-bottom: 95px;
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: #f7f3eb; font-size: 18px;
        }

        #map {
            width: 100%; height: calc(100vh - 64px - 95px); min-height: 500px; background: #e5e0d8;
        }

        .map-header {
            background: linear-gradient(135deg, #657b6d, #879889); color: white;
            padding: 16px 18px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 1000;
        }
        .map-header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
        .map-header .back-btn {
            color: white; text-decoration: none; font-size: 17px;
            background: rgba(255,255,255,0.2); padding: 8px 16px;
            border-radius: 20px; border: none; cursor: pointer;
        }

        .legend {
            position: absolute; bottom: 130px; left: 14px;
            background: rgba(255,255,255,0.92); padding: 14px 18px;
            border-radius: 14px; font-size: 17px; box-shadow: 0 3px 12px rgba(0,0,0,0.15);
            z-index: 1000; pointer-events: none; backdrop-filter: blur(4px); line-height: 1.8;
        }
        .legend .row { display: flex; align-items: center; gap: 12px; }
        .legend .dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
        .legend .dot.green { background: #657b6d; }
        .legend .dot.hotel { background: #c49a6c; }
        .legend .dot.food { background: #e07b5a; }

        .disclaimer {
            position: absolute; bottom: 85px; left: 14px;
            background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.9);
            padding: 8px 18px; border-radius: 24px; font-size: 16px;
            z-index: 1000; pointer-events: none; backdrop-filter: blur(4px);
        }

        .marker-green { background: #657b6d; border: 2px solid white; border-radius: 50%; width: 20px; height: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .marker-hotel { background: #c49a6c; border: 2px solid white; border-radius: 50%; width: 32px; height: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; }
        .marker-food { background: #e07b5a; border: 2px solid white; border-radius: 50%; width: 18px; height: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

        .leaflet-popup-content { font-size: 17px; line-height: 1.8; min-width: 200px; }
        .leaflet-popup-content strong { color: #4d5748; font-size: 19px; }
        .leaflet-popup-content .addr { color: #888; font-size: 15px; margin-top: 4px; }
        .leaflet-popup-content .tag { display: inline-block; font-size: 13px; padding: 2px 12px; border-radius: 20px; margin-top: 6px; color: white; }
        .leaflet-popup-content .tag.spot-tag { background: #657b6d; }
        .leaflet-popup-content .tag.hotel-tag { background: #c49a6c; }
        .leaflet-popup-content .tag.food-tag { background: #e07b5a; }

        @media (max-width: 600px) {
            #map { height: calc(100vh - 60px - 95px); min-height: 400px; }
            .map-header h1 { font-size: 20px; }
            .legend { font-size: 15px; padding: 10px 14px; bottom: 115px; left: 10px; }
            .legend .dot { width: 14px; height: 14px; }
            .disclaimer { font-size: 14px; bottom: 78px; left: 10px; padding: 6px 14px; }
            .leaflet-popup-content { font-size: 15px; }
            .leaflet-popup-content strong { font-size: 17px; }
            .marker-hotel { width: 28px; height: 28px; font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="map-header">
    <h1>🗺️ 南京景點地圖</h1>
    <a href="spots.html" class="back-btn">← 返回</a>
</div>

<div id="map"></div>

<div class="legend">
    <div class="row"><span class="dot green"></span> 景點</div>
    <div class="row"><span class="dot hotel"></span> 🏨 酒店</div>
    <div class="row"><span class="dot food"></span> 🍴 推薦餐廳</div>
</div>
<div class="disclaimer">📍 本地圖所顯示的位置僅供參考</div>

<nav class="mobile-nav">
    <a href="index.html"><span>🏠</span><small>首頁</small></a>
    <a href="itinerary.html"><span>📅</span><small>六日行程</small></a>
    <a href="spots.html" class="active"><span>📚</span><small>景點百科</small></a>
</nav>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ============================================================
// 1. 初始化地圖
// ============================================================
const map = L.map('map', {
    center: [32.06, 118.78],
    zoom: 13,
    zoomControl: true
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// ============================================================
// 2. 自訂標記圖示
// ============================================================
const greenIcon = L.divIcon({ className: 'marker-green', iconSize: [20, 20], popupAnchor: [0, -12] });
const hotelIcon = L.divIcon({ className: 'marker-hotel', iconSize: [32, 32], popupAnchor: [0, -18], html: '🏨' });
const foodIcon = L.divIcon({ className: 'marker-food', iconSize: [18, 18], popupAnchor: [0, -10] });

// ============================================================
// 3. 終極資料庫 (直接寫死，唔靠 spots-data.js，保證有橙點)
// ============================================================
const mapData = [
    // ===== 酒店 =====
{ name: "新街口張府園亞朵酒店", lat: 32.0345, lng: 118.7825, type: "hotel", desc: "秦淮區中山南路238號" },

    // ===== 景點 =====
    { name: "南京博物院", lat: 32.040802, lng: 118.825064, type: "spot", desc: "中山東路321號" },
    { name: "明孝陵", lat: 32.058355, lng: 118.839731, type: "spot", desc: "石象路7號" },
    { name: "總統府", lat: 32.044258, lng: 118.797318, type: "spot", desc: "長江路292號" },
    { name: "科舉博物館", lat: 32.02171, lng: 118.79049, type: "spot", desc: "貢院街95號" },
    { name: "德基藝術博物館", lat: 32.050008, lng: 118.785075, type: "spot", desc: "中山路18號德基廣場二期8樓" },
    { name: "六朝博物館", lat: 32.04370, lng: 118.79760, type: "spot", desc: "長江路302號" },
    { name: "李香君故居", lat: 32.02472, lng: 118.78906, type: "spot", desc: "大石壩街150號" },
    { name: "老門東", lat: 32.01162, lng: 118.78724, type: "spot", desc: "剪子巷54號" },
    { name: "三七八巷", lat: 32.01557, lng: 118.78039, type: "spot", desc: "長樂路" },
    { name: "瞻園", lat: 32.02052, lng: 118.78550, type: "spot", desc: "瞻園路128號" },
    { name: "雞鳴寺", lat: 32.057266, lng: 118.798082, type: "spot", desc: "雞鳴寺路1號" },
    { name: "玄武湖", lat: 32.074816, lng: 118.792841, type: "spot", desc: "玄武巷1號" },
    { name: "南京城牆(中華門)", lat: 32.01295, lng: 118.78168, type: "spot", desc: "中華路" },
    { name: "頤和路", lat: 32.06485, lng: 118.77062, type: "spot", desc: "鼓樓區頤和路" },
    { name: "甘熙故居", lat: 32.02852, lng: 118.77598, type: "spot", desc: "中山南路400號" },
    { name: "南京大屠殺紀念館", lat: 32.03535, lng: 118.74215, type: "spot", desc: "水西門大街418號" },
    { name: "高淳老街", lat: 31.32018, lng: 118.86773, type: "spot", desc: "高淳區淳溪街道" },
    { name: "漆橋古村", lat: 31.37593, lng: 118.992493, type: "spot", desc: "高淳區漆橋村" },
    { name: "江寧織造博物館", lat: 32.046, lng: 118.794, type: "spot", desc: "長江路123號" },

    // ===== 餐廳 (包含所有新舊餐廳，保證有橙點) =====
    { name: "小潘記鴨血粉絲湯", lat: 32.04900, lng: 118.79550, type: "restaurant", desc: "珠江路275-3號" },
    { name: "南京大牌檔（夫子廟平江店）", lat: 32.01850, lng: 118.78650, type: "restaurant", desc: "大石壩街48號" },
    { name: "南京大牌檔（1912街區店）", lat: 32.04450, lng: 118.79920, type: "restaurant", desc: "長江路288號1912街區" },
    { name: "天圓樓·老南京菜", lat: 32.01985, lng: 118.78780, type: "restaurant", desc: "大石壩街75號" },
    { name: "碳山河·茶湯火鍋", lat: 32.05050, lng: 118.78620, type: "restaurant", desc: "金陵天地5樓L551" },
    { name: "奇芳閣", lat: 32.02020, lng: 118.78700, type: "restaurant", desc: "貢院西街12-1號" },
    { name: "韓復興板鴨店", lat: 32.01920, lng: 118.78850, type: "restaurant", desc: "石壩街126號" },
    { name: "金宏興鴨子店", lat: 32.04500, lng: 118.78350, type: "restaurant", desc: "明瓦廊5號105室" },
    { name: "李記清真館", lat: 32.02680, lng: 118.77680, type: "restaurant", desc: "打釘巷1號" },
    { name: "蔣有記（老門東店）", lat: 32.01120, lng: 118.78750, type: "restaurant", desc: "老門東三條營49-3號" },
    { name: "雞鳴湯包", lat: 32.05650, lng: 118.79850, type: "restaurant", desc: "太平門街10號" },
    { name: "小廚娘淮揚菜", lat: 32.04550, lng: 118.78550, type: "restaurant", desc: "新街口艾尚天地B座3樓" },
    { name: "李百蟹·江南蟹黃麵", lat: 32.01950, lng: 118.78900, type: "restaurant", desc: "夫子廟大石壩街（瞻園附近）" },
    { name: "回味鴨血粉絲湯", lat: 32.01650, lng: 118.78650, type: "restaurant", desc: "夫子廟站4號口店" }
];

// ============================================================
// 4. 將資料標記在地圖上
// ============================================================
const allMarkers = [];
const markerDictionary = {}; // 用嚟記錄名同 Marker 嘅對應

mapData.forEach(loc => {
    let icon, popupHtml;

    if (loc.type === 'hotel') {
        icon = hotelIcon;
        popupHtml = `
            <strong>🏨 ${loc.name}</strong>
            <div class="addr">📍 ${loc.desc}</div>
            <div><span class="tag hotel-tag">🏠 連住5晚</span></div>
        `;
    } else if (loc.type === 'spot') {
        icon = greenIcon;
        popupHtml = `
            <strong>📍 ${loc.name}</strong>
            <div class="addr">📍 ${loc.desc}</div>
            <div><span class="tag spot-tag">🏷️ 景點</span></div>
        `;
    } else {
        icon = foodIcon;
        popupHtml = `
            <strong>🍴 ${loc.name}</strong>
            <div class="addr">📍 ${loc.desc}</div>
            <div><span class="tag food-tag">🍽️ 推薦餐廳</span></div>
        `;
    }

    const marker = L.marker([loc.lat, loc.lng], { icon: icon })
        .addTo(map)
        .bindPopup(popupHtml);

    allMarkers.push(marker);
    markerDictionary[loc.name] = marker;
});

// ============================================================
// 5. 無敵 URL 定位邏輯
// ============================================================
function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    let val = urlParams.get(param);
    if (val) {
        try { val = decodeURIComponent(val); } catch(e) {}
    }
    return val;
}

function zoomToTarget(queryName) {
    if (!queryName) return;

    let targetMarker = null;

    // 1. 精確匹配
    if (markerDictionary[queryName]) {
        targetMarker = markerDictionary[queryName];
    } else {
        // 2. 模糊匹配 (雙向 includes，處理例如「南京大牌檔」對「南京大牌檔（夫子廟平江店）」)
        for (const name in markerDictionary) {
            // 去除括號內容再比對，增加成功率
            const cleanName = name.split('（')[0].split('(')[0];
            const cleanQuery = queryName.split('（')[0].split('(')[0];
            
            if (name.includes(queryName) || queryName.includes(name) || 
                cleanName.includes(cleanQuery) || cleanQuery.includes(cleanName)) {
                targetMarker = markerDictionary[name];
                break;
            }
        }
    }

    if (targetMarker) {
        const latlng = targetMarker.getLatLng();
        map.setView(latlng, 16, { animate: true, duration: 0.8 });
        targetMarker.openPopup();
    } else {
        console.warn('地圖上找不到：', queryName);
        alert('地圖上找不到「' + queryName + '」的準確位置。');
    }
}

// 延遲執行確保地圖載入完成
setTimeout(() => {
    const spotParam = getQueryParam('spot');
    if (spotParam) {
        zoomToTarget(spotParam);
    }
}, 400);

window.addEventListener('resize', () => {
    map.invalidateSize();
});
</script>

</body>
</html>
