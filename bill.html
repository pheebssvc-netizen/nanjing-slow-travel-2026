<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊記帳與結算</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #007aff;
      --border-color: #e5e5ea;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    /* Collapsible Card */
    .collapsible-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: bold;
      user-select: none;
    }

    .collapsible-header::after {
      content: '▼';
      font-size: 12px;
      transition: transform 0.3s ease;
    }

    .collapsible-header.active::after {
      transform: rotate(180deg);
    }

    .collapsible-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
      margin-top: 0;
    }

    .collapsible-content.open {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    /* Avatar Grid */
    .avatar-grid {
      display: flex;
      gap: 12px;
      justify-content: space-around;
      margin-bottom: 16px;
    }

    .avatar-btn {
      border: 2px solid transparent;
      background: #f0f0f5;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .avatar-btn.selected {
      border-color: var(--accent-color);
      background: #e5f0ff;
      transform: scale(1.1);
    }

    .avatar-label {
      text-align: center;
      font-size: 12px;
      margin-top: 4px;
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
      color: #666;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
      font-size: 16px;
    }

    button.primary {
      background-color: var(--accent-color);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button.primary:active {
      opacity: 0.8;
    }

    /* Checkbox Group */
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f0f0f5;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 14px;
      cursor: pointer;
    }

    .chip input {
      width: auto;
    }

    /* Table/List styles */
    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .summary-item:last-child {
      border-bottom: none;
    }

    .settlement-notice {
      background: #eef6ff;
      padding: 10px;
      border-radius: 8px;
      color: #0055b8;
      font-size: 14px;
      margin-top: 8px;
    }

    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .delete-btn {
      background: #ff3b30;
      color: white;
      border: none;
      width: auto;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>旅遊記帳與結算</h1>

  <!-- 設定匯率 -->
  <div class="card">
    <div class="form-group">
      <label for="exchangeRate">匯率 (1 人民幣 = ? 港幣)</label>
      <input type="number" id="exchangeRate" value="1.10" step="0.01" onchange="renderSummary()">
    </div>
  </div>

  <!-- 新增消費 -->
  <div class="card">
    <h2>新增消費</h2>

    <div class="form-group">
      <label>付款人</label>
      <div class="avatar-grid">
        <div>
          <button type="button" class="avatar-btn selected" onclick="selectPayer('📷J', this)">📷</button>
          <div class="avatar-label">J</div>
        </div>
        <div>
          <button type="button" class="avatar-btn" onclick="selectPayer('🪙C', this)">🪙</button>
          <div class="avatar-label">C</div>
        </div>
        <div>
          <button type="button" class="avatar-btn" onclick="selectPayer('🥐K', this)">🥐</button>
          <div class="avatar-label">K</div>
        </div>
        <div>
          <button type="button" class="avatar-btn" onclick="selectPayer('🍇Z', this)">🍇</button>
          <div class="avatar-label">Z</div>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="itemDesc">項目說明</label>
      <input type="text" id="itemDesc" placeholder="例如：午餐、車費">
    </div>

    <div class="form-group">
      <label for="amount">金額</label>
      <input type="number" id="amount" placeholder="0.00" step="0.01">
    </div>

    <div class="form-group">
      <label for="currency">貨幣</label>
      <select id="currency">
        <option value="RMB">人民幣 (RMB)</option>
        <option value="HKD">港幣 (HKD)</option>
      </select>
    </div>

    <div class="form-group">
      <label>參與分攤者</label>
      <div class="checkbox-group">
        <label class="chip"><input type="checkbox" value="📷J" checked> 📷 J</label>
        <label class="chip"><input type="checkbox" value="🪙C" checked> 🪙 C</label>
        <label class="chip"><input type="checkbox" value="🥐K" checked> 🥐 K</label>
        <label class="chip"><input type="checkbox" value="🍇Z" checked> 🍇 Z</label>
      </div>
    </div>

    <button type="button" class="primary" onclick="addExpense()">新增紀錄</button>
  </div>

  <!-- 結帳總覽 (摺疊卡片區塊) -->
  <h2>結帳總覽</h2>

  <!-- 卡片 1: 消費總額 -->
  <div class="card">
    <div class="collapsible-header" onclick="toggleCard(this)">
      <span>總消費統計</span>
    </div>
    <div class="collapsible-content">
      <div id="totalSpending"></div>
    </div>
  </div>

  <!-- 卡片 2: 人民幣結算 -->
  <div class="card">
    <div class="collapsible-header" onclick="toggleCard(this)">
      <span>人民幣結算 (RMB)</span>
    </div>
    <div class="collapsible-content">
      <div id="rmbSettlement"></div>
    </div>
  </div>

  <!-- 卡片 3: 港幣結算 -->
  <div class="card">
    <div class="collapsible-header" onclick="toggleCard(this)">
      <span>港幣結算 (HKD)</span>
    </div>
    <div class="collapsible-content">
      <div id="hkdSettlement"></div>
    </div>
  </div>

  <!-- 消費歷史紀錄 -->
  <div class="card">
    <h2>消費紀錄</h2>
    <ul class="history-list" id="historyList"></ul>
  </div>

</div>

<script>
  let selectedPayer = '📷J';
  let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

  const USERS = ['📷J', '🪙C', '🥐K', '🍇Z'];
  const COUPLE = ['📷J', '🪙C']; // 夫婦主帳戶

  function selectPayer(payer, btn) {
    selectedPayer = payer;
    document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }

  function toggleCard(header) {
    header.classList.toggle('active');
    const content = header.nextElementSibling;
    if (content.classList.contains('open')) {
      content.classList.remove('open');
      content.style.maxHeight = null;
    } else {
      content.classList.add('open');
      content.style.maxHeight = content.scrollHeight + "px";
    }
  }

  function addExpense() {
    const desc = document.getElementById('itemDesc').value.trim() || '未命名項目';
    const amount = parseFloat(document.getElementById('amount').value);
    const currency = document.getElementById('currency').value;
    
    const participants = Array.from(document.querySelectorAll('.checkbox-group input:checked'))
                              .map(cb => cb.value);

    if (isNaN(amount) || amount <= 0) {
      alert('請輸入有效金額');
      return;
    }

    if (participants.length === 0) {
      alert('請至少選擇一位參與分攤者');
      return;
    }

    const expense = {
      id: Date.now(),
      payer: selectedPayer,
      desc: desc,
      amount: amount,
      currency: currency,
      participants: participants
    };

    expenses.push(expense);
    saveAndRender();

    // Reset Form
    document.getElementById('itemDesc').value = '';
    document.getElementById('amount').value = '';
  }

  function deleteExpense(id) {
    expenses = expenses.filter(e => e.id !== id);
    saveAndRender();
  }

  function saveAndRender() {
    localStorage.setItem('expenses', JSON.stringify(expenses));
    renderHistory();
    renderSummary();
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    list.innerHTML = '';

    if (expenses.length === 0) {
      list.innerHTML = '<li style="text-align:center; color:#8e8e93; padding:12px;">暫無消費紀錄</li>';
      return;
    }

    expenses.slice().reverse().forEach(exp => {
      const li = document.createElement('li');
      li.className = 'history-item';
      li.innerHTML = `
        <div>
          <strong>${exp.desc}</strong> (${exp.payer} 付款)<br>
          <small style="color:#666;">分攤: ${exp.participants.join(', ')}</small>
        </div>
        <div style="text-align:right;">
          <span style="font-weight:bold;">${exp.amount.toFixed(2)} ${exp.currency}</span><br>
          <button class="delete-btn" onclick="deleteExpense(${exp.id})">刪除</button>
        </div>
      `;
      list.appendChild(li);
    });
  }

  function renderSummary() {
    const rate = parseFloat(document.getElementById('exchangeRate').value) || 1.1;

    // 初始化統計數據
    let totalRMB = 0;
    let totalHKD = 0;

    let netRMB = { '📷J': 0, '🪙C': 0, '🥐K': 0, '🍇Z': 0 };
    let netHKD = { '📷J': 0, '🪙C': 0, '🥐K': 0, '🍇Z': 0 };

    let actualSpentRMB = { '📷J': 0, '🪙C': 0, '🥐K': 0, '🍇Z': 0 };
    let actualSpentHKD = { '📷J': 0, '🪙C': 0, '🥐K': 0, '🍇Z': 0 };

    expenses.forEach(exp => {
      const splitAmount = exp.amount / exp.participants.length;

      if (exp.currency === 'RMB') {
        totalRMB += exp.amount;
        netRMB[exp.payer] += exp.amount;
        exp.participants.forEach(p => {
          netRMB[p] -= splitAmount;
          actualSpentRMB[p] += splitAmount;
        });
      } else {
        totalHKD += exp.amount;
        netHKD[exp.payer] += exp.amount;
        exp.participants.forEach(p => {
          netHKD[p] -= splitAmount;
          actualSpentHKD[p] += splitAmount;
        });
      }
    });

    // 1. 渲染消費總額
    let totalHTML = `
      <div class="summary-item"><span>RMB 總消費：</span><strong>¥${totalRMB.toFixed(2)}</strong></div>
      <div class="summary-item"><span>HKD 總消費：</span><strong>$${totalHKD.toFixed(2)}</strong></div>
      <hr style="border:none; border-top:1px dashed var(--border-color); margin:8px 0;">
      <div style="font-weight:bold; margin-bottom:6px;">個人實質消費總額 (以主帳戶夫婦共用結算)：</div>
    `;

    // 計算個人實質消費 (以主帳戶結算：J與C合併)
    const coupleActualRMB = actualSpentRMB['📷J'] + actualSpentRMB['🪙C'];
    const coupleActualHKD = actualSpentHKD['📷J'] + actualSpentHKD['🪙C'];
    const coupleCombinedHKD = coupleActualHKD + (coupleActualRMB * rate);

    totalHTML += `
      <div class="summary-item">
        <span>📷J & 🪙C (夫婦主帳戶)：</span>
        <span>¥${coupleActualRMB.toFixed(2)} / $${coupleActualHKD.toFixed(2)} <br><small style="color:#666;">(折合 HKD $${coupleCombinedHKD.toFixed(2)})</small></span>
      </div>
    `;

    ['🥐K', '🍇Z'].forEach(u => {
      const combinedHKD = actualSpentHKD[u] + (actualSpentRMB[u] * rate);
      totalHTML += `
        <div class="summary-item">
          <span>${u}：</span>
          <span>¥${actualSpentRMB[u].toFixed(2)} / $${actualSpentHKD[u].toFixed(2)} <br><small style="color:#666;">(折合 HKD $${combinedHKD.toFixed(2)})</small></span>
        </div>
      `;
    });

    document.getElementById('totalSpending').innerHTML = totalHTML;

    // 2. 渲染結算邏輯 (以夫婦主帳戶結算)
    document.getElementById('rmbSettlement').innerHTML = calculateSettlement(netRMB, 'RMB');
    document.getElementById('hkdSettlement').innerHTML = calculateSettlement(netHKD, 'HKD');

    // 動態調整已展開卡片的高度，防止內容溢出
    document.querySelectorAll('.collapsible-content.open').forEach(content => {
      content.style.maxHeight = content.scrollHeight + "px";
    });
  }

  function calculateSettlement(netBalances, currencySymbol) {
    // 主帳戶合併：J 與 C 淨額相加，歸入 📷J (代表主帳戶)
    let balances = {
      '主帳戶 (📷J & 🪙C)': netBalances['📷J'] + netBalances['🪙C'],
      '🥐K': netBalances['🥐K'],
      '🍇Z': netBalances['🍇Z']
    };

    let debtors = [];
    let creditors = [];

    for (let user in balances) {
      let amount = balances[user];
      if (amount < -0.01) {
        debtors.push({ name: user, amount: -amount });
      } else if (amount > 0.01) {
        creditors.push({ name: user, amount: amount });
      }
    }

    let html = '';
    
    if (debtors.length === 0 && creditors.length === 0) {
      return '<div style="color:#8e8e93; text-align:center;">此貨幣無須轉帳結算</div>';
    }

    debtors.forEach(d => {
      creditors.forEach(c => {
        if (d.amount > 0 && c.amount > 0) {
          let payment = Math.min(d.amount, c.amount);
          html += `<div class="summary-item"><span><strong>${d.name}</strong> 應付給 <strong>${c.name}</strong>：</span><strong>${payment.toFixed(2)} ${currencySymbol}</strong></div>`;
          d.amount -= payment;
          c.amount -= payment;
        }
      });
    });

    html += `<div class="settlement-notice">💡 註：已自動將 📷J 與 🪙C 之帳目合併至「主帳戶」統一結算。</div>`;

    return html;
  }

  // 初始化載入
  saveAndRender();
</script>

</body>
</html>
