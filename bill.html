<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>神算醒｜金陵慢遊</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <style>
        /* ===== 基本重置 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: #f5f2ec;
            color: #3f3933;
            font-size: 20px;
            line-height: 1.7;
            padding: 0 0 95px 0;
            min-height: 100vh;
        }

        /* ===== 頂部標題欄 ===== */
        .header {
            background: linear-gradient(135deg, #657b6d, #879889);
            color: white;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header .back-btn {
            color: white;
            text-decoration: none;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .header .back-btn:active {
            transform: scale(0.95);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header .clear-btn {
            color: white;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 15px;
            cursor: pointer;
        }

        .header .clear-btn:active {
            transform: scale(0.95);
        }

        /* ===== 主容器 ===== */
        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 16px;
        }

        /* ===== 區域標題 ===== */
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #4d5748;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .badge {
            font-size: 14px;
            font-weight: 400;
            color: #8a8a7a;
        }

        /* ===== 快速入帳卡片 ===== */
        .entry-card {
            background: white;
            border-radius: 18px;
            padding: 20px 18px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(80, 70, 50, 0.07);
        }

        .entry-card .section-label {
            font-size: 14px;
            font-weight: 600;
            color: #8a8a7a;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        /* 日期 */
        .date-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .date-row input[type="date"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #e0ddd5;
            border-radius: 10px;
            font-size: 18px;
            background: #faf8f5;
            color: #3f3933;
            font-family: inherit;
        }

        .date-row .today-btn {
            padding: 10px 16px;
            background: #e9eee8;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            color: #4d5748;
            cursor: pointer;
            white-space: nowrap;
        }

        .date-row .today-btn:active {
            transform: scale(0.95);
        }

        /* 分類快捷鍵 */
        .category-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .category-pill {
            padding: 8px 16px;
            border-radius: 24px;
            border: 1px solid #e0ddd5;
            background: white;
            font-size: 16px;
            font-weight: 500;
            color: #6a6a5a;
            cursor: pointer;
            transition: 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .category-pill:active {
            transform: scale(0.94);
        }

        .category-pill.active {
            background: #657b6d;
            color: white;
            border-color: #657b6d;
        }

        /* 描述 + 金額 */
        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        .input-row .desc-input {
            flex: 2;
            min-width: 140px;
            padding: 12px 16px;
            border: 1px solid #e0ddd5;
            border-radius: 10px;
            font-size: 18px;
            background: #faf8f5;
            font-family: inherit;
            color: #3f3933;
        }

        .input-row .desc-input:focus {
            outline: none;
            border-color: #657b6d;
        }

        .input-row .amount-input {
            flex: 1;
            min-width: 110px;
            padding: 12px 16px;
            border: 1px solid #e0ddd5;
            border-radius: 10px;
            font-size: 24px;
            font-weight: 700;
            background: #faf8f5;
            text-align: right;
            font-family: inherit;
            color: #3f3933;
        }

        .input-row .amount-input:focus {
            outline: none;
            border-color: #657b6d;
        }

        /* 付款人 + 參與人 */
        .member-section {
            margin-bottom: 12px;
        }

        .member-section .label {
            font-size: 16px;
            font-weight: 600;
            color: #8a8a7a;
            display: block;
            margin-bottom: 6px;
        }

        .member-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .member-btn {
            padding: 8px 18px;
            border-radius: 24px;
            border: 1px solid #e0ddd5;
            background: white;
            font-size: 17px;
            font-weight: 500;
            color: #6a6a5a;
            cursor: pointer;
            transition: 0.15s;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .member-btn:active {
            transform: scale(0.94);
        }

        .member-btn.active-payer {
            background: #657b6d;
            color: white;
            border-color: #657b6d;
        }

        .member-btn.active-participant {
            background: #b89a68;
            color: white;
            border-color: #b89a68;
        }

        .member-btn .icon {
            font-size: 18px;
        }

        .member-btn .count {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.7;
        }

        /* 提交按鈕 */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #657b6d;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            margin-top: 4px;
        }

        .submit-btn:active {
            transform: scale(0.97);
            background: #556b5d;
        }

        /* ===== 歷史消費明細 ===== */
        .history-card {
            background: white;
            border-radius: 18px;
            padding: 18px 16px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(80, 70, 50, 0.07);
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .history-header .count-badge {
            font-size: 15px;
            color: #8a8a7a;
            background: #f5f2ec;
            padding: 2px 14px;
            border-radius: 20px;
        }

        /* 篩選列 */
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .filter-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #e0ddd5;
            background: white;
            font-size: 15px;
            font-weight: 500;
            color: #6a6a5a;
            cursor: pointer;
            transition: 0.15s;
        }

        .filter-btn:active {
            transform: scale(0.94);
        }

        .filter-btn.active {
            background: #657b6d;
            color: white;
            border-color: #657b6d;
        }

        /* 消費記錄列表 */
        .bill-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 450px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .bill-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: #faf8f5;
            border-radius: 12px;
            border-left: 5px solid #b89a68;
            transition: 0.15s;
            position: relative;
        }

        .bill-item .info {
            flex: 1;
            min-width: 0;
        }

        .bill-item .info .top {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .bill-item .info .top .cat {
            font-size: 13px;
            font-weight: 600;
            color: #657b6d;
            background: #e9eee8;
            padding: 0 10px;
            border-radius: 12px;
        }

        .bill-item .info .top .desc {
            font-size: 17px;
            font-weight: 600;
            color: #3f3933;
            word-break: break-word;
        }

        .bill-item .info .bottom {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            font-size: 15px;
            color: #8a8a7a;
            margin-top: 2px;
        }

        .bill-item .info .bottom .payer {
            font-weight: 600;
            color: #4d5748;
        }

        .bill-item .info .bottom .participants {
            display: flex;
            gap: 4px;
        }

        .bill-item .info .bottom .participants span {
            background: #edeae3;
            padding: 0 8px;
            border-radius: 10px;
            font-size: 13px;
        }

        .bill-item .amount {
            font-size: 20px;
            font-weight: 700;
            color: #3f3933;
            white-space: nowrap;
            margin-left: auto;
            padding-left: 8px;
        }

        .bill-item .del-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #d0c8bc;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: 0.15s;
        }

        .bill-item .del-btn:active {
            color: #b07a6a;
            transform: scale(0.9);
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: #b0a898;
            font-size: 18px;
        }

        /* ===== 結帳總覽 ===== */
        .settlement-card {
            background: white;
            border-radius: 18px;
            padding: 18px 16px;
            box-shadow: 0 3px 12px rgba(80, 70, 50, 0.07);
            border-top: 4px solid #b89a68;
            margin-bottom: 10px;
        }

        .settlement-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f0ede6;
        }

        .settlement-stats .stat {
            text-align: center;
        }

        .settlement-stats .stat .num {
            font-size: 28px;
            font-weight: 700;
            color: #3f3933;
        }

        .settlement-stats .stat .label {
            font-size: 15px;
            color: #8a8a7a;
        }

        .transfer-result {
            background: #f5f8f0;
            border-radius: 12px;
            padding: 14px 16px;
        }

        .transfer-result .title {
            font-size: 16px;
            font-weight: 600;
            color: #4d5748;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .transfer-result .title .count {
            color: #b89a68;
        }

        .transfer-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
            font-size: 18px;
            font-weight: 500;
        }

        .transfer-item .arrow {
            color: #b89a68;
            margin: 0 6px;
        }

        .transfer-item .amount {
            font-weight: 700;
            color: #3f3933;
            margin-left: auto;
            white-space: nowrap;
        }

        .transfer-empty {
            text-align: center;
            color: #b0a898;
            font-size: 17px;
            padding: 8px 0;
        }

        /* ===== 狀態提示（同步中/已同步） ===== */
        .sync-status {
            text-align: center;
            font-size: 14px;
            color: #8a8a7a;
            padding: 4px 0 10px 0;
        }

        .sync-status .synced {
            color: #4a8a5a;
        }

        /* ===== Toast 提示 ===== */
        .toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(60, 60, 50, 0.92);
            color: white;
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
        }

        /* ===== 回到頂部 ===== */
        #backToTop {
            position: fixed;
            right: 16px;
            bottom: 100px;
            z-index: 9999;
            border: none;
            border-radius: 999px;
            padding: 14px 18px;
            background: rgba(108, 126, 111, 0.92);
            color: white;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #backToTop:active {
            transform: scale(0.95);
        }

        @media (max-width: 600px) {
            #backToTop {
                padding: 12px 15px;
                font-size: 16px;
                bottom: 90px;
                right: 12px;
            }
        }

        /* ===== 手機底部導航 ===== */
        .mobile-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 70px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid #e8e5dc;
            box-shadow: 0 -3px 15px rgba(0, 0, 0, 0.06);
            z-index: 9998;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .mobile-nav a {
            flex: 1;
            height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #88877f;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-nav a span {
            font-size: 22px;
            line-height: 24px;
        }

        .mobile-nav a small {
            margin-top: 3px;
            font-size: 13px;
            font-weight: 600;
        }

        .mobile-nav a.active {
            color: #607667;
        }

        .mobile-nav a:active {
            transform: scale(0.95);
        }

        /* ===== 手機適配 ===== */
        @media (max-width: 420px) {
            .entry-card {
                padding: 16px 14px;
            }

            .input-row .desc-input {
                font-size: 17px;
                padding: 10px 14px;
            }

            .input-row .amount-input {
                font-size: 22px;
                padding: 10px 14px;
            }

            .member-btn {
                font-size: 15px;
                padding: 6px 14px;
            }

            .category-pill {
                font-size: 15px;
                padding: 6px 14px;
            }

            .bill-item .info .top .desc {
                font-size: 16px;
            }

            .bill-item .amount {
                font-size: 18px;
            }

            .settlement-stats .stat .num {
                font-size: 24px;
            }

            .header h1 {
                font-size: 20px;
            }

            .section-title {
                font-size: 18px;
            }

            #backToTop {
                padding: 12px 15px;
                font-size: 16px;
                bottom: 90px;
                right: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== 頂部標題欄 ===== -->
    <div class="header">
        <a href="index.html" class="back-btn">← 返回</a>
        <h1>🧮 神算醒</h1>
        <button class="clear-btn" id="clearAllBtn">清空</button>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== 主容器 ===== -->
    <div class="container" id="app">

        <!-- ===== 快速入帳 ===== -->
        <div class="section-title">🧾 快速入帳</div>

        <div class="entry-card">
            <div class="date-row">
                <input type="date" id="billDate">
                <button class="today-btn" id="todayBtn">📅 今天</button>
            </div>

            <div class="category-row" id="categoryGroup">
                <button class="category-pill" data-cat="早餐">🍞 早餐</button>
                <button class="category-pill" data-cat="午餐">🍱 午餐</button>
                <button class="category-pill" data-cat="晚餐">🍷 晚餐</button>
                <button class="category-pill" data-cat="小食">☕ 小食</button>
                <button class="category-pill" data-cat="門票">🎟️ 門票</button>
                <button class="category-pill" data-cat="交通">🚗 交通</button>
                <button class="category-pill" data-cat="雜項">🛍️ 雜項</button>
            </div>

            <div class="input-row">
                <input class="desc-input" id="descInput" placeholder="項目名稱" maxlength="30">
                <input class="amount-input" id="amountInput" type="number" step="0.1" placeholder="0" inputmode="decimal">
            </div>

            <div class="member-section">
                <span class="label">💰 付款人</span>
                <div class="member-btn-group" id="payerGroup">
                    <!-- 由 JavaScript 生成 -->
                </div>
            </div>

            <div class="member-section">
                <span class="label">👥 參與人</span>
                <div class="member-btn-group" id="participantGroup">
                    <!-- 由 JavaScript 生成 -->
                </div>
            </div>

            <button class="submit-btn" id="submitBtn">➕ 記錄</button>
        </div>

        <!-- ===== 歷史消費明細 ===== -->
        <div class="history-card">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
    <div class="section-title" style="margin-bottom:0;">📋 消費明細</div>
    <span class="count-badge" id="countBadge">0 筆</span>
</div>

            <div class="filter-row">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="today">今天</button>
                <button class="filter-btn" data-filter="week">本週</button>
            </div>

            <div class="bill-list" id="billList">
                <div class="empty-state">📭 未有消費記錄，開始記帳吧！</div>
            </div>
        </div>

        <!-- ===== 結帳總覽 ===== -->
        <div class="section-title" style="margin-top:6px;">📊 結帳總覽</div>

        <div class="settlement-card" id="settlementCard">
            <div class="settlement-stats">
                <div class="stat">
                    <div class="num" id="totalAmount">¥0</div>
                    <div class="label">總支出</div>
                </div>
                <div class="stat">
                    <div class="num" id="perPerson">¥0</div>
                    <div class="label">人均</div>
                </div>
                <div class="stat">
                    <div class="num" id="personCount">0 人</div>
                    <div class="label">參與人數</div>
                </div>
            </div>

            <div class="transfer-result">
                <div class="title">
                    <span>💰 最少轉帳</span>
                    <span class="count" id="transferCount">0 次</span>
                </div>
                <div id="transferList">
                    <div class="transfer-empty">未有帳目需要結算</div>
                </div>
            </div>
        </div>

        <div class="sync-status" id="syncStatus">⏳ 連接中...</div>

        <!-- ===== 回到頂部 ===== -->
        <button id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
            ↑ 回到頂部
        </button>

    </div>

    <!-- ===== 手機底部導航 ===== -->
    <nav class="mobile-nav">
        <a href="index.html">
            <span>🏠</span>
            <small>首頁</small>
        </a>
        <a href="itinerary.html">
            <span>📅</span>
            <small>六日行程</small>
        </a>
        <a href="spots.html">
            <span>📚</span>
            <small>景點百科</small>
        </a>
    </nav>

    <script>
        // ============================================================
        // Firebase 設定
        // ============================================================

        const firebaseConfig = {
            apiKey: "AIzaSyAtthBBNoHJkN6B_e8DVjzDpK_eB0wfExo",
            authDomain: "yunnan-trip-d5626.firebaseapp.com",
            databaseURL: "https://yunnan-trip-d5626-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "yunnan-trip-d5626",
            storageBucket: "yunnan-trip-d5626.firebasestorage.app",
            messagingSenderId: "956753515518",
            appId: "1:956753515518:web:12586ad55c62ddc63426af",
            measurementId: "G-KS61L3SC94"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const billsRef = database.ref('nanjing/bills');

        // ============================================================
        // 設定
        // ============================================================

        // 4 組人：J=2人, C=2人, D=2人, S=1人
        const GROUPS = [
            { id: 'J', label: 'J', count: 2, icon: '👥' },
            { id: 'C', label: 'C', count: 2, icon: '👥' },
            { id: 'D', label: 'D', count: 2, icon: '👥' },
            { id: 'S', label: 'S', count: 1, icon: '👤' }
        ];

        const GROUP_MAP = Object.fromEntries(GROUPS.map(g => [g.id, g]));

        const CATEGORY_COLORS = {
            '早餐': '#e8d5b0',
            '午餐': '#d4c8a8',
            '晚餐': '#c4a88a',
            '小食': '#d4c4b0',
            '門票': '#b0c4b0',
            '交通': '#b0b8c4',
            '雜項': '#c4b8b0'
        };

        let bills = [];
        let currentFilter = 'all';

        // ============================================================
        // Firebase 同步
        // ============================================================

        let isFirstLoad = true;

        billsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                bills = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                }));
                // 按日期倒序排列
                bills.sort((a, b) => {
                    if (a.date !== b.date) return b.date.localeCompare(a.date);
                    return b.id.localeCompare(a.id);
                });
            } else {
                bills = [];
            }
            renderAll();
            updateSyncStatus(true);

            if (isFirstLoad) {
                isFirstLoad = false;
                showToast('✅ 已同步，共 ' + bills.length + ' 筆記錄');
            }
        }, (error) => {
            console.warn('Firebase read error:', error);
            updateSyncStatus(false);
            showToast('⚠️ 同步失敗，請檢查網絡');
        });

        function updateSyncStatus(ok) {
            const el = document.getElementById('syncStatus');
            if (ok) {
                el.innerHTML = '✅ 已同步';
            } else {
                el.innerHTML = '⚠️ 離線模式';
            }
        }

        function saveToFirebase(bill) {
            const newRef = billsRef.push();
            return newRef.set(bill);
        }

        function deleteFromFirebase(id) {
            return billsRef.child(id).remove();
        }

        function clearAllFirebase() {
            return billsRef.remove();
        }

        // ============================================================
        // 工具函數
        // ============================================================

        function getToday() {
            const d = new Date();
            return d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
        }

        function isToday(dateStr) {
            return dateStr === getToday();
        }

        function isThisWeek(dateStr) {
            const today = new Date();
            const target = new Date(dateStr);
            const diff = (today - target) / (1000 * 60 * 60 * 24);
            return diff >= 0 && diff <= 7;
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                el.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        // 渲染：成員按鈕
        // ============================================================

        function renderMemberButtons() {
            // 付款人
            const payerGroup = document.getElementById('payerGroup');
            payerGroup.innerHTML = '';
            GROUPS.forEach((g, idx) => {
                const btn = document.createElement('button');
                btn.className = 'member-btn active-payer';
                btn.dataset.member = g.id;
                btn.innerHTML = `${g.icon} ${g.label} <span class="count">(${g.count}人)</span>`;
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#payerGroup .member-btn').forEach(b => b.classList.remove(
                        'active-payer'));
                    this.classList.add('active-payer');
                });
                payerGroup.appendChild(btn);
            });

            // 參與人（預設全選）
            const participantGroup = document.getElementById('participantGroup');
            participantGroup.innerHTML = '';
            GROUPS.forEach(g => {
                const btn = document.createElement('button');
                btn.className = 'member-btn active-participant';
                btn.dataset.member = g.id;
                btn.innerHTML = `${g.icon} ${g.label} <span class="count">(${g.count}人)</span>`;
                btn.addEventListener('click', function() {
                    this.classList.toggle('active-participant');
                });
                participantGroup.appendChild(btn);
            });
        }

        function getSelectedPayer() {
            const active = document.querySelector('#payerGroup .member-btn.active-payer');
            return active ? active.dataset.member : GROUPS[0].id;
        }

        function getSelectedParticipants() {
            const btns = document.querySelectorAll('#participantGroup .member-btn.active-participant');
            return Array.from(btns).map(b => b.dataset.member);
        }

        function getSelectedCategory() {
            const active = document.querySelector('.category-pill.active');
            return active ? active.dataset.cat : null;
        }

        // ============================================================
        // 分類快捷鍵
        // ============================================================

        function setupCategoryPills() {
            const pills = document.querySelectorAll('.category-pill');
            pills.forEach(pill => {
                pill.addEventListener('click', function() {
                    const isActive = this.classList.contains('active');
                    document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
                    if (!isActive) {
                        this.classList.add('active');
                        const desc = document.getElementById('descInput');
                        if (desc.value === '') {
                            desc.value = this.dataset.cat;
                        }
                    } else {
                        const desc = document.getElementById('descInput');
                        if (desc.value === desc.dataset.lastCat || desc.value === '') {
                            desc.value = '';
                        }
                    }
                });
            });
        }

        // ============================================================
        // 核心：新增記錄
        // ============================================================

        function addBill() {
            const date = document.getElementById('billDate').value || getToday();
            const category = getSelectedCategory() || '雜項';
            const desc = document.getElementById('descInput').value.trim() || category;
            const payer = getSelectedPayer();
            const participants = getSelectedParticipants();
            const amount = parseFloat(document.getElementById('amountInput').value);

            if (!amount || amount <= 0) {
                showToast('⚠️ 請輸入有效金額');
                return;
            }

            if (participants.length === 0) {
                showToast('⚠️ 請選擇至少一組參與人');
                return;
            }

            if (!participants.includes(payer)) {
                showToast('⚠️ 付款人必須係參與人之一');
                return;
            }

            const bill = {
                date: date,
                category: category,
                description: desc,
                payer: payer,
                amount: Math.round(amount * 100) / 100,
                participants: participants.slice()
            };

            // 寫入 Firebase
            saveToFirebase(bill)
                .then(() => {
                    // 重置表單
                    document.getElementById('amountInput').value = '';
                    document.getElementById('descInput').value = '';
                    document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
                    document.querySelectorAll('#participantGroup .member-btn').forEach(b => b.classList.add(
                        'active-participant'));

                    showToast('✅ 已記錄：' + desc + ' ¥' + bill.amount.toFixed(1));
                    document.getElementById('amountInput').focus();
                })
                .catch((err) => {
                    console.warn('Save error:', err);
                    showToast('⚠️ 儲存失敗，請稍後再試');
                });
        }

        // ============================================================
        // 核心：刪除記錄
        // ============================================================

        function deleteBill(id) {
            if (!confirm('確定要刪除呢筆記錄嗎？')) return;
            deleteFromFirebase(id)
                .then(() => {
                    showToast('🗑️ 已刪除記錄');
                })
                .catch((err) => {
                    console.warn('Delete error:', err);
                    showToast('⚠️ 刪除失敗，請稍後再試');
                });
        }

        // ============================================================
        // 核心：清空所有
        // ============================================================

        function clearAll() {
            if (bills.length === 0) {
                showToast('📭 已經冇記錄');
                return;
            }
            if (!confirm('⚠️ 確定要清空所有消費記錄嗎？')) return;
            clearAllFirebase()
                .then(() => {
                    showToast('🗑️ 已清空所有記錄');
                })
                .catch((err) => {
                    console.warn('Clear error:', err);
                    showToast('⚠️ 清空失敗，請稍後再試');
                });
        }

        // ============================================================
        // 核心：結算算法
        // ============================================================

        function calculateSettlement(filteredBills) {
            if (filteredBills.length === 0) {
                return { total: 0, perPerson: 0, personCount: 0, transfers: [], balances: {} };
            }

            // 初始化每組淨額
            const balances = {};
            GROUPS.forEach(g => balances[g.id] = 0);

            let totalAmount = 0;
            let totalPersonCount = 0;
            const allParticipants = new Set();

            filteredBills.forEach(bill => {
                const participants = bill.participants.filter(p => GROUPS.some(g => g.id === p));
                if (participants.length === 0) return;

                // 計算參與總人數
                let totalPeople = 0;
                participants.forEach(p => {
                    const g = GROUP_MAP[p];
                    if (g) totalPeople += g.count;
                });
                if (totalPeople === 0) return;

                const share = bill.amount / totalPeople;
                totalAmount += bill.amount;

                // 付款人：支付全額
                if (balances[bill.payer] !== undefined) {
                    balances[bill.payer] += bill.amount;
                }

                // 所有參與人：分攤
                participants.forEach(p => {
                    const g = GROUP_MAP[p];
                    if (g && balances[p] !== undefined) {
                        balances[p] -= share * g.count;
                        allParticipants.add(p);
                    }
                });
            });

            // 四捨五入
            GROUPS.forEach(g => {
                balances[g.id] = Math.round(balances[g.id] * 100) / 100;
            });

            const activeGroups = GROUPS.filter(g => Math.abs(balances[g.id]) > 0.01);
            const personCount = activeGroups.reduce((sum, g) => sum + g.count, 0);
            const perPerson = personCount > 0 ? Math.round((totalAmount / personCount) * 100) / 100 : 0;

            // 計算轉帳（貪心算法）
            const positive = GROUPS.filter(g => balances[g.id] > 0.01)
                .map(g => ({ name: g.id, amount: balances[g.id] }));
            const negative = GROUPS.filter(g => balances[g.id] < -0.01)
                .map(g => ({ name: g.id, amount: Math.abs(balances[g.id]) }));

            positive.sort((a, b) => b.amount - a.amount);
            negative.sort((a, b) => b.amount - a.amount);

            const transfers = [];
            let i = 0,
                j = 0;
            while (i < positive.length && j < negative.length) {
                const p = positive[i];
                const n = negative[j];
                const amount = Math.round(Math.min(p.amount, n.amount) * 100) / 100;

                if (amount > 0.01) {
                    transfers.push({
                        from: n.name,
                        to: p.name,
                        amount: amount
                    });
                }

                p.amount -= amount;
                n.amount -= amount;

                if (p.amount < 0.01) i++;
                if (n.amount < 0.01) j++;
            }

            return {
                total: Math.round(totalAmount * 100) / 100,
                perPerson: perPerson,
                personCount: personCount,
                transfers: transfers,
                balances: balances
            };
        }

        // ============================================================
        // 渲染
        // ============================================================

        function getFilteredBills() {
            let result = [...bills];

            if (currentFilter === 'today') {
                result = result.filter(b => isToday(b.date));
            } else if (currentFilter === 'week') {
                result = result.filter(b => isThisWeek(b.date));
            }

            result.sort((a, b) => {
                if (a.date !== b.date) return b.date.localeCompare(a.date);
                return b.id.localeCompare(a.id);
            });

            return result;
        }

        function renderAll() {
            const filtered = getFilteredBills();
            renderBillList(filtered);
            renderSettlement(filtered);
            document.getElementById('countBadge').textContent = filtered.length + ' 筆';
            renderFilterButtons();
        }

        function renderBillList(filtered) {
            const container = document.getElementById('billList');

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 沒有符合嘅記錄</div>';
                return;
            }

            let html = '';
            filtered.forEach(bill => {
                const catColor = CATEGORY_COLORS[bill.category] || '#e0ddd5';
                const participantsStr = bill.participants.join('、');
                html += `
                    <div class="bill-item" style="border-left-color: ${catColor}">
                        <div class="info">
                            <div class="top">
                                <span class="cat">${bill.category}</span>
                                <span class="desc">${bill.description}</span>
                            </div>
                            <div class="bottom">
                                <span class="payer">💰 ${bill.payer}</span>
                                <span>👥 ${participantsStr}</span>
                                <span>📅 ${bill.date}</span>
                            </div>
                        </div>
                        <div class="amount">¥${bill.amount.toFixed(1)}</div>
                        <button class="del-btn" data-id="${bill.id}">✕</button>
                    </div>
                `;
            });

            container.innerHTML = html;

            container.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    deleteBill(this.dataset.id);
                });
            });
        }

        function renderSettlement(filtered) {
            const result = calculateSettlement(filtered);

            document.getElementById('totalAmount').textContent = '¥' + result.total.toFixed(1);
            document.getElementById('perPerson').textContent = '¥' + result.perPerson.toFixed(1);
            document.getElementById('personCount').textContent = result.personCount + ' 人';

            const transferList = document.getElementById('transferList');
            const transferCount = document.getElementById('transferCount');

            if (result.transfers.length === 0) {
                transferList.innerHTML = '<div class="transfer-empty">✅ 帳目已平，冇人欠錢！</div>';
                transferCount.textContent = '0 次';
                return;
            }

            transferCount.textContent = result.transfers.length + ' 次';

            let html = '';
            result.transfers.forEach(t => {
                html += `
                    <div class="transfer-item">
                        <span>👤 ${t.from}</span>
                        <span class="arrow">➜</span>
                        <span>👤 ${t.to}</span>
                        <span class="amount">¥${t.amount.toFixed(1)}</span>
                    </div>
                `;
            });
            transferList.innerHTML = html;
        }

        function renderFilterButtons() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === currentFilter);
            });
        }

        // ============================================================
        // 初始化
        // ============================================================

        function init() {
            renderMemberButtons();
            setupCategoryPills();

            document.getElementById('billDate').value = getToday();

            document.getElementById('todayBtn').addEventListener('click', function() {
                document.getElementById('billDate').value = getToday();
            });

            document.getElementById('submitBtn').addEventListener('click', addBill);

            document.getElementById('amountInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addBill();
                }
            });
            document.getElementById('descInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('amountInput').focus();
                }
            });

            document.getElementById('clearAllBtn').addEventListener('click', clearAll);

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    currentFilter = this.dataset.filter;
                    renderAll();
                });
            });

            // 初始渲染（等 Firebase 第一次回調）
            // renderAll() 會由 Firebase on 觸發
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
