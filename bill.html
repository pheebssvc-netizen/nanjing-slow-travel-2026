<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>神算醒｜金陵慢遊</title>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        /* ===== 基本重置 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: #f5f2ec;
            color: #3f3933;
            font-size: 20px;
            line-height: 1.7;
            padding: 0 0 95px 0;
            min-height: 100vh;
        }

        /* ===== 頂部標題欄 ===== */
        .header {
            background: linear-gradient(135deg, #657b6d, #879889);
            color: white;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header .back-btn {
            color: white;
            text-decoration: none;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .header .back-btn:active {
            transform: scale(0.95);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header .clear-btn {
            color: white;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 15px;
            cursor: pointer;
        }

        .header .clear-btn:active {
            transform: scale(0.95);
        }

        /* ===== 主容器 ===== */
        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 16px;
        }

        /* ===== 區域標題 ===== */
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #4d5748;
            margin-bottom: 10px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title .badge {
            font-size: 15px;
            font-weight: 400;
            color: #8a8a7a;
            background: #f5f2ec;
            padding: 2px 14px;
            border-radius: 20px;
        }

        /* ===== 快速入帳卡片 ===== */
        .entry-card {
            background: white;
            border-radius: 18px;
            padding: 20px 18px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(80, 70, 50, 0.07);
        }

        /* 日期 */
        .date-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .date-row input[type="date"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #e0ddd5;
            border-radius: 10px;
            font-size: 18px;
            background: #faf8f5;
            color: #3f3933;
            font-family: inherit;
        }

        .date-row .today-btn {
            padding: 10px 16px;
            background: #e9eee8;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            color: #4d5748;
            cursor: pointer;
            white-space: nowrap;
        }

        .date-row .today-btn:active {
            transform: scale(0.95);
        }

        /* 分類快捷鍵 */
        .category-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .category-pill {
            padding: 8px 16px;
            border-radius: 24px;
            border: 1px solid #e0ddd5;
            background: white;
            font-size: 16px;
            font-weight: 500;
            color: #6a6a5a;
            cursor: pointer;
            transition: 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .category-pill:active {
            transform: scale(0.94);
        }

        .category-pill.active {
            background: #657b6d;
            color: white;
            border-color: #657b6d;
        }

        /* 描述 + 幣別 + 金額 */
        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
            align-items: center;
        }

        .input-row .desc-input {
            flex: 2;
            min-width: 130px;
            padding: 12px 14px;
            border: 1px solid #e0ddd5;
            border-radius: 10px;
            font-size: 18px;
            background: #faf8f5;
            font-family: inherit;
            color: #3f3933;
        }

        .input-row .desc-input:focus {
            outline: none;
            border-color: #657b6d;
        }

        /* 幣別切換按鈕 */
        .currency-switch {
            display: flex;
            background: #faf8f5;
            border: 1px solid #e0ddd5;
            border-radius: 10px;
            overflow: hidden;
            height: 52px;
        }

        .currency-btn {
            padding: 0 12px;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 700;
            color: #8a8a7a;
            cursor: pointer;
            transition: 0.15s;
        }

        .currency-btn.active {
            background: #b89a68;
            color: white;
        }

        .input-row .amount-input {
            flex: 1;
            min-width: 100px;
            padding: 12px 14px;
            border: 1px solid #e0ddd5;
            border-radius: 10px;
            font-size: 22px;
            font-weight: 700;
            background: #faf8f5;
            text-align: right;
            font-family: inherit;
            color: #3f3933;
        }

        .input-row .amount-input:focus {
            outline: none;
            border-color: #657b6d;
        }

        /* 付款人 + 參與人 */
        .member-section {
            margin-bottom: 12px;
        }

        .member-section .label {
            font-size: 16px;
            font-weight: 600;
            color: #8a8a7a;
            display: block;
            margin-bottom: 6px;
        }

        .member-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .member-btn {
            padding: 8px 18px;
            border-radius: 24px;
            border: 1px solid #e0ddd5;
            background: white;
            font-size: 17px;
            font-weight: 500;
            color: #6a6a5a;
            cursor: pointer;
            transition: 0.15s;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .member-btn:active {
            transform: scale(0.94);
        }

        .member-btn.active-payer {
            background: #657b6d;
            color: white;
            border-color: #657b6d;
        }

        .member-btn.active-participant {
            background: #b89a68;
            color: white;
            border-color: #b89a68;
        }

        .member-btn .count {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.7;
        }

        /* 提交按鈕 */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #657b6d;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            margin-top: 4px;
        }

        .submit-btn:active {
            transform: scale(0.97);
            background: #556b5d;
        }

        /* ===== 結帳總覽卡片 ===== */
        .settlement-card {
            background: white;
            border-radius: 18px;
            padding: 18px 16px;
            box-shadow: 0 3px 12px rgba(80, 70, 50, 0.07);
            border-top: 4px solid #b89a68;
            margin-bottom: 20px;
        }

        .personal-expenditure-box {
            background: #faf8f5;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 14px;
            border: 1px solid #f0ede6;
        }

        .personal-expenditure-box .box-title {
            font-size: 16px;
            font-weight: 700;
            color: #4d5748;
            margin-bottom: 8px;
        }

        .personal-expenditure-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 12px;
        }

        .personal-item {
            font-size: 16px;
            color: #3f3933;
            display: flex;
            justify-content: space-between;
            background: #ffffff;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #e8e5dc;
        }

        .personal-item .name {
            font-weight: 600;
            color: #657b6d;
        }

        .personal-item .val {
            font-weight: 700;
        }

        .transfer-result {
            background: #f5f8f0;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }

        .transfer-result.hkd-result {
            background: #f0f4f8;
            margin-top: 10px;
        }

        .transfer-result .title {
            font-size: 16px;
            font-weight: 600;
            color: #4d5748;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .transfer-result .title .count {
            color: #b89a68;
        }

        .transfer-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 0;
            font-size: 18px;
            font-weight: 500;
            border-bottom: 1px dashed #e0ddd5;
        }

        .transfer-item:last-child {
            border-bottom: none;
        }

        .transfer-item .arrow {
            color: #b89a68;
            margin: 0 6px;
        }

        .transfer-item .amount {
            font-weight: 700;
            color: #3f3933;
            margin-left: auto;
            white-space: nowrap;
        }

        .transfer-empty {
            text-align: center;
            color: #b0a898;
            font-size: 17px;
            padding: 8px 0;
        }

        /* 一鍵複製 WhatsApp 按鈕 */
        .copy-btn {
            width: 100%;
            padding: 14px;
            background: #2D5A47;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .copy-btn:active {
            transform: scale(0.97);
            background: #234738;
        }

        /* ===== 歷史消費明細 ===== */
        .history-card {
            background: white;
            border-radius: 18px;
            padding: 18px 16px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(80, 70, 50, 0.07);
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .filter-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #e0ddd5;
            background: white;
            font-size: 15px;
            font-weight: 500;
            color: #6a6a5a;
            cursor: pointer;
            transition: 0.15s;
        }

        .filter-btn:active {
            transform: scale(0.94);
        }

        .filter-btn.active {
            background: #657b6d;
            color: white;
            border-color: #657b6d;
        }

        .bill-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 450px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .bill-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            background: #faf8f5;
            border-radius: 12px;
            border-left: 5px solid #b89a68;
            transition: 0.15s;
            position: relative;
        }

        .bill-item .info {
            flex: 1;
            min-width: 0;
        }

        .bill-item .info .top {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .bill-item .info .top .cat {
            font-size: 13px;
            font-weight: 600;
            color: #657b6d;
            background: #e9eee8;
            padding: 0 10px;
            border-radius: 12px;
        }

        .bill-item .info .top .desc {
            font-size: 17px;
            font-weight: 600;
            color: #3f3933;
            word-break: break-word;
        }

        .bill-item .info .bottom {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            font-size: 15px;
            color: #8a8a7a;
            margin-top: 2px;
        }

        .bill-item .info .bottom .payer {
            font-weight: 600;
            color: #4d5748;
        }

        .bill-item .info .bottom .participants {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .bill-item .info .bottom .participants span {
            background: #edeae3;
            padding: 0 8px;
            border-radius: 10px;
            font-size: 13px;
        }

        .bill-item .amount {
            font-size: 20px;
            font-weight: 700;
            color: #3f3933;
            white-space: nowrap;
            margin-left: auto;
            padding-left: 4px;
        }

        .bill-item .action-btns {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .bill-item .edit-btn,
        .bill-item .del-btn {
            background: none;
            border: none;
            font-size: 18px;
            color: #d0c8bc;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            transition: 0.15s;
        }

        .bill-item .edit-btn:active {
            color: #657b6d;
            transform: scale(0.9);
        }

        .bill-item .del-btn:active {
            color: #b07a6a;
            transform: scale(0.9);
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: #b0a898;
            font-size: 18px;
        }

        /* ===== 狀態提示（同步中/已同步） ===== */
        .sync-status {
            text-align: center;
            font-size: 14px;
            color: #8a8a7a;
            padding: 4px 0 10px 0;
        }

        /* ===== Toast 提示 ===== */
        .toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(60, 60, 50, 0.92);
            color: white;
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
        }

        /* ===== 自訂確認彈窗 ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 24px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-card {
            background: white;
            border-radius: 20px;
            padding: 26px 22px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #3f3933;
            margin-bottom: 10px;
        }
        .modal-message {
            font-size: 16px;
            color: #6a6a5a;
            margin-bottom: 22px;
            line-height: 1.6;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        .modal-btn {
            flex: 1;
            padding: 13px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: 0.15s;
        }
        .modal-btn:active {
            transform: scale(0.95);
        }
        .modal-btn.cancel {
            background: #f0ede6;
            color: #6a6a5a;
        }
        .modal-btn.confirm {
            background: #b07a6a;
            color: white;
        }

        /* ===== 回到頂部 ===== */
        #backToTop {
            position: fixed;
            right: 16px;
            bottom: 100px;
            z-index: 9999;
            border: none;
            border-radius: 999px;
            padding: 14px 18px;
            background: rgba(108, 126, 111, 0.92);
            color: white;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #backToTop:active {
            transform: scale(0.95);
        }

        /* ===== 神算醒小導遊（右側中上） ===== */
        .duck-bill {
            position: fixed;
            right: 15px;
            top: 25%;
            width: 85px;
            height: auto;
            z-index: 999;
            pointer-events: none;
            animation: floatDuck 3s ease-in-out infinite;
        }

        @keyframes floatDuck {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* ===== 手機底部導航 ===== */
        .mobile-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 70px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(255, 255, 255, 0.96);
            border-top: 1px solid #e8e5dc;
            box-shadow: 0 -3px 15px rgba(0, 0, 0, 0.06);
            z-index: 9998;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .mobile-nav a {
            flex: 1;
            height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #88877f;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-nav a span {
            font-size: 22px;
            line-height: 24px;
        }

        .mobile-nav a small {
            margin-top: 3px;
            font-size: 13px;
            font-weight: 600;
        }

        @media (max-width: 420px) {
            .entry-card { padding: 16px 14px; }
            .input-row .desc-input { font-size: 16px; padding: 10px; }
            .input-row .amount-input { font-size: 20px; padding: 10px; }
            .currency-switch { height: 48px; }
            .currency-btn { padding: 0 8px; font-size: 14px; }
            .member-btn { font-size: 15px; padding: 6px 14px; }
            .category-pill { font-size: 15px; padding: 6px 14px; }
            .duck-bill { top: 20%; right: 10px; width: 80px; }
            .personal-expenditure-grid { grid-template-columns: 1fr; }
            .modal-card { padding: 20px 16px; }
        }
    </style>
</head>

<body>

    <div class="header">
        <a href="index.html" class="back-btn">← 返回</a>
        <h1>🧮 神算醒</h1>
        <button class="clear-btn" id="clearAllBtn">清空</button>
    </div>

    <div class="toast" id="toast"></div>

    <div class="container" id="app">

        <div class="section-title">🧾 快速入帳</div>

        <div class="entry-card">
            <div class="date-row">
                <input type="date" id="billDate">
                <button class="today-btn" id="todayBtn">📅 今天</button>
            </div>

            <div class="category-row" id="categoryGroup">
                <button class="category-pill" data-cat="早餐">🍞 早餐</button>
                <button class="category-pill" data-cat="午餐">🍱 午餐</button>
                <button class="category-pill" data-cat="晚餐">🍷 晚餐</button>
                <button class="category-pill" data-cat="小食">☕ 小食</button>
                <button class="category-pill" data-cat="門票">🎟️ 門票</button>
                <button class="category-pill" data-cat="交通">🚗 交通</button>
                <button class="category-pill" data-cat="雜項">🛍️ 雜項</button>
            </div>

            <div class="input-row">
                <input class="desc-input" id="descInput" placeholder="項目名稱" maxlength="30">

                <div class="currency-switch">
                    <button type="button" class="currency-btn active" id="btnRMB" data-currency="RMB">¥ RMB</button>
                    <button type="button" class="currency-btn" id="btnHKD" data-currency="HKD">$ HKD</button>
                </div>

                <input class="amount-input" id="amountInput" type="number" step="0.1" placeholder="0" inputmode="decimal">
            </div>

            <div class="member-section">
                <span class="label">🤑 付款人</span>
                <div class="member-btn-group" id="payerGroup"></div>
            </div>

            <div class="member-section">
                <span class="label">✌️ 參與人</span>
                <div class="member-btn-group" id="participantGroup"></div>
            </div>

            <button class="submit-btn" id="submitBtn">➕ 記錄</button>
        </div>

        <div class="section-title">📊 結帳總覽</div>

        <div class="settlement-card" id="settlementCard">

            <div class="personal-expenditure-box">
                <div class="box-title">💳 各組別個人總消費額</div>
                <div class="personal-expenditure-grid" id="personalExpenditureList">
                </div>
            </div>

            <div class="transfer-result" id="rmbTransferResult">
                <div class="title">
                    <span>💰 人民幣結算 (RMB)</span>
                    <span class="count" id="rmbTransferCount">0 次</span>
                </div>
                <div id="rmbTransferList">
                    <div class="transfer-empty">未有帳目需要結算</div>
                </div>
            </div>

            <div class="transfer-result hkd-result" id="hkdTransferResult" style="display: none;">
                <div class="title">
                    <span style="color:#2a52be;">🇭🇰 港幣結算 (HKD)</span>
                    <span class="count" id="hkdTransferCount">0 次</span>
                </div>
                <div id="hkdTransferList">
                    <div class="transfer-empty">未有帳目需要結算</div>
