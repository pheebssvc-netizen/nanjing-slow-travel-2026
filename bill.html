<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>神算醒｜金陵慢遊</title>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        /* ===== 基本重置 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: #f5f2ec;
            color: #3f3933;
            font-size: 20px;
            line-height: 1.7;
            padding: 0 0 95px 0;
            min-height: 100vh;
        }

        /* ===== 頂部標題欄 ===== */
        .header {
            background: linear-gradient(135deg, #657b6d, #879889);
            color: white;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header .back-btn {
            color: white;
            text-decoration: none;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .header .back-btn:active {
            transform: scale(0.95);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header .clear-btn {
            color: white;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 15px;
            cursor: pointer;
        }

        .header .clear-btn:active {
            transform: scale(0.95);
        }

        /* ===== 主容器 ===== */
        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 16px;
        }

        /* ===== 區域標題 ===== */
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #4d5748;
            margin-bottom: 10px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title .badge {
            font-size: 15px;
            font-weight: 400;
            color: #8a8a7a;
            background: #f5f2ec;
            padding: 2px 14px;
            border-radius: 20px;
        }

        /* ===== 快速入帳卡片 ===== */
        .entry-card {
            background: white;
            border-radius: 18px;
            padding: 20px 18px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(80, 70, 50, 0.07);
        }

        /* 日期 */
        .date-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .date-row input[type="date"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #e0ddd5;
            border-radius: 10px;
            font-size: 18px;
            background: #faf8f5;
            color: #3f3933;
            font-family: inherit;
        }

        .date-row .today-btn {
            padding: 10px 16px;
            background: #e9eee8;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            color: #4d5748;
            cursor: pointer;
            white-space: nowrap;
        }

        .date-row .today-btn:active {
            transform: scale(0.95);
        }

        /* 分類快捷鍵 */
        .category-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .category-pill {
            padding: 8px 16px;
            border-radius: 24px;
            border: 1px solid #e0ddd5;
            background: white;
            font-size: 16px;
            font-weight: 500;
            color: #6a6a5a;
            cursor: pointer;
            transition: 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .category-pill:active {
            transform: scale(0.94);
        }

        .category-pill.active {
            background: #657b6d;
            color: white;
            border-color: #657b6d;
        }

        /* 描述 + 幣別 + 金額 */
        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
            align-items: center;
        }

        .input-row .desc-input {
            flex: 2;
            min-width: 130px;
            padding: 12px 14px;
            border: 1px solid #e0ddd5;
            border-radius: 10px;
            font-size: 18px;
            background: #faf8f5;
            font-family: inherit;
            color: #3f3933;
        }

        .input-row .desc-input:focus {
            outline: none;
            border-color: #657b6d;
        }

        /* 幣別切換按鈕 */
        .currency-switch {
            display: flex;
            background: #faf8f5;
            border: 1px solid #e0ddd5;
            border-radius: 10px;
            overflow: hidden;
            height: 52px;
        }

        .currency-btn {
            padding: 0 12px;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 700;
            color: #8a8a7a;
            cursor: pointer;
            transition: 0.15s;
        }

        .currency-btn.active {
            background: #b89a68;
            color: white;
        }

        .input-row .amount-input {
            flex: 1;
            min-width: 100px;
            padding: 12px 14px;
            border: 1px solid #e0ddd5;
            border-radius: 10px;
            font-size: 22px;
            font-weight: 700;
            background: #faf8f5;
            text-align: right;
            font-family: inherit;
            color: #3f3933;
        }

        .input-row .amount-input:focus {
            outline: none;
            border-color: #657b6d;
        }

        /* 付款人 + 參與人 */
        .member-section {
            margin-bottom: 12px;
        }

        .member-section .label {
            font-size: 16px;
            font-weight: 600;
            color: #8a8a7a;
            display: block;
            margin-bottom: 6px;
        }

        .member-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .member-btn {
            padding: 8px 18px;
            border-radius: 24px;
            border: 1px solid #e0ddd5;
            background: white;
            font-size: 17px;
            font-weight: 500;
            color: #6a6a5a;
            cursor: pointer;
            transition: 0.15s;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .member-btn:active {
            transform: scale(0.94);
        }

        .member-btn.active-payer {
            background: #657b6d;
            color: white;
            border-color: #657b6d;
        }

        .member-btn.active-participant {
            background: #b89a68;
            color: white;
            border-color: #b89a68;
        }

        .member-btn .count {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.7;
        }

        /* 提交按鈕 */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #657
