<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多人拆賬與夫婦結算系統</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --border-color: #e5e7eb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h2, h3 {
      margin-top: 0;
      color: #111827;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input[type="number"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--primary-color);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      padding: 0;
    }

    /* 參與者卡片網格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .account-card {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      background: #fafafa;
      transition: background 0.2s;
    }

    .account-card.active {
      background: #eef2ff;
      border-color: #a5b4fc;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-header label {
      margin: 0;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .settings-btn:hover {
      background: #e0e7ff;
    }

    .sub-members {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
      display: none;
      flex-direction: column;
      gap: 6px;
      padding-left: 8px;
    }

    .sub-members.open {
      display: flex;
    }

    .sub-members label {
      font-weight: normal;
      font-size: 14px;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #4338ca;
    }

    /* 結算報告區 */
    .result-section {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 2px solid var(--border-color);
    }

    .summary-box {
      background: #f9fafb;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .settlement-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .settlement-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      font-weight: 500;
    }

    .highlight-pay {
      color: #dc2626;
    }
    .highlight-receive {
      color: #16a34a;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>消費拆賬與結算 (方案一)</h2>

  <!-- 1. 金額與付款人 -->
  <div class="form-group">
    <label for="amount">總金額 ($)</label>
    <input type="number" id="amount" placeholder="請輸入金額，例如：900" value="900" min="0">
  </div>

  <div class="form-group">
    <label for="payer">實際付款人 (個人標籤)</label>
    <select id="payer">
      <option value="🕺J">🕺J</option>
      <option value="💃C">💃C</option>
      <option value="🕺C">🕺C</option>
      <option value="💃R">💃R</option>
      <option value="🕺D" selected>🕺D</option>
      <option value="💃J">💃J</option>
      <option value="🕺S">🕺S</option>
      <option value="🕺M">🕺M</option>
      <option value="🕺T">🕺T</option>
    </select>
  </div>

  <!-- 2. 選擇參與者 (預設全選) -->
  <div class="form-group">
    <div class="header-actions">
      <label style="margin:0;">參與者 (<span id="participant-count">9</span> 人)</label>
      <div>
        <button type="button" class="btn-link" onclick="selectAll(true)">全選</button> | 
        <button type="button" class="btn-link" onclick="selectAll(false)">清空</button>
      </div>
    </div>

    <div class="grid" id="accounts-grid">
      <!-- 由 JS 動態繪製卡片 -->
    </div>
  </div>

  <button class="submit-btn" onclick="calculateBill()">計算結算</button>

  <!-- 3. 計算結果 -->
  <div class="result-section" id="result-section" style="display: none;">
    <h3>結算結果</h3>
    <div class="summary-box" id="summary-info"></div>
    <ul class="settlement-list" id="settlement-results"></ul>
  </div>
</div>

<script>
  // 1. 賬戶與個人成員結構定義
  const schema = [
    { account: "🕺J & 💃C", members: ["🕺J", "💃C"] },
    { account: "🕺C & 💃R", members: ["🕺C", "💃R"] },
    { account: "🕺D & 💃J", members: ["🕺D", "💃J"] },
    { account: "🕺S", members: ["🕺S"] },
    { account: "🕺M", members: ["🕺M"] },
    { account: "🕺T", members: ["🕺T"] }
  ];

  // 渲染 UI 介面
  function initUI() {
    const grid = document.getElementById('accounts-grid');
    grid.innerHTML = '';

    schema.forEach((group, groupIdx) => {
      const isCouple = group.members.length > 1;
      const card = document.createElement('div');
      card.className = 'account-card active';
      card.id = `card-${groupIdx}`;

      let subHTML = '';
      if (isCouple) {
        subHTML = `
          <div class="sub-members" id="sub-${groupIdx}">
            ${group.members.map(m => `
              <label>
                <input type="checkbox" class="member-checkbox" data-group="${groupIdx}" value="${m}" checked onchange="onSubChange(${groupIdx})">
                ${m}
              </label>
            `).join('')}
          </div>
        `;
      }

      card.innerHTML = `
        <div class="card-header">
          <label>
            <input type="checkbox" class="group-checkbox" id="group-check-${groupIdx}" checked onchange="onGroupChange(${groupIdx})">
            ${group.account}
          </label>
          ${isCouple ? `<button type="button" class="settings-btn" onclick="toggleSub(${groupIdx})" title="展開細分">⚙️</button>` : ''}
        </div>
        ${subHTML}
      `;

      grid.appendChild(card);
    });

    updateCount();
  }

  // 展開/收起子身分選單
  function toggleSub(groupIdx) {
    const sub = document.getElementById(`sub-${groupIdx}`);
    if (sub) sub.classList.toggle('open');
  }

  // 整組勾選事件
  function onGroupChange(groupIdx) {
    const groupCheck = document.getElementById(`group-check-${groupIdx}`);
    const memberChecks = document.querySelectorAll(`.member-checkbox[data-group="${groupIdx}"]`);
    
    memberChecks.forEach(chk => chk.checked = groupCheck.checked);
    updateCardState(groupIdx);
    updateCount();
  }

  // 子個人勾選事件
  function onSubChange(groupIdx) {
    const groupCheck = document.getElementById(`group-check-${groupIdx}`);
    const memberChecks = document.querySelectorAll(`.member-checkbox[data-group="${groupIdx}"]`);
    const checkedCount = Array.from(memberChecks).filter(c => c.checked).length;

    // 半選或全選狀態處理
    groupCheck.checked = checkedCount > 0;
    updateCardState(groupIdx);
    updateCount();
  }

  // 更新卡片高亮樣式
  function updateCardState(groupIdx) {
    const groupCheck = document.getElementById(`group-check-${groupIdx}`);
    const card = document.getElementById(`card-${groupIdx}`);
    if (groupCheck.checked) {
      card.classList.add('active');
    } else {
      card.classList.remove('active');
    }
  }

  // 全選 / 清空
  function selectAll(status) {
    document.querySelectorAll('.group-checkbox').forEach(c => c.checked = status);
    document.querySelectorAll('.member-checkbox').forEach(c => c.checked = status);
    schema.forEach((_, idx) => updateCardState(idx));
    updateCount();
  }

  // 取得目前所有已勾選的「個人標籤」
  function getSelectedMembers() {
    const selected = [];
    schema.forEach((group, idx) => {
      if (group.members.length === 1) {
        if (document.getElementById(`group-check-${idx}`).checked) {
          selected.push(group.members[0]);
        }
      } else {
        const memberChecks = document.querySelectorAll(`.member-checkbox[data-group="${idx}"]`);
        memberChecks.forEach(chk => {
          if (chk.checked) selected.push(chk.value);
        });
      }
    });
    return selected;
  }

  // 更新顯示總參與人數
  function updateCount() {
    const members = getSelectedMembers();
    document.getElementById('participant-count').innerText = members.length;
  }

  // 3. 核心計算邏輯
  function calculateBill() {
    const amount = parseFloat(document.getElementById('amount').value);
    const payer = document.getElementById('payer').value;
    const participants = getSelectedMembers();

    if (!amount || amount <= 0) {
      alert('請輸入有效的消費金額！');
      return;
    }

    if (participants.length === 0) {
      alert('請至少選擇一位參與者！');
      return;
    }

    const perPerson = amount / participants.length;

    // 1. 初始化每個人頭的應收/應付 (個人層級)
    const personalBalance = {};
    // 取得所有人名清單
    schema.flatMap(g => g.members).forEach(m => personalBalance[m] = 0);

    // 付款人先墊付全額
    personalBalance[payer] += amount;

    // 參與者扣除個人消費額
    participants.forEach(m => {
      personalBalance[m] -= perPerson;
    });

    // 2. 自動歸併 (Roll-up) 至主結算帳戶 (夫婦/個人組合)
    const accountBalance = {};
    schema.forEach(g => {
      let sum = 0;
      g.members.forEach(m => {
        sum += personalBalance[m];
      });
      accountBalance[g.account] = sum;
    });

    // 3. 找出付款人所屬的主帳戶
    const payerAccountObj = schema.find(g => g.members.includes(payer));
    const payerAccount = payerAccountObj ? payerAccountObj.account : payer;

    // 渲染摘要資訊
    document.getElementById('summary-info').innerHTML = `
      <strong>總金額：</strong>$${amount.toFixed(1)} <br>
      <strong>付款人：</strong>${payer}（屬於 ${payerAccount} 帳戶）<br>
      <strong>實際參與：</strong>${participants.length} 人（每人分擔 $${perPerson.toFixed(1)}）
    `;

    // 渲染轉賬結算清單
    const resultsUl = document.getElementById('settlement-results');
    resultsUl.innerHTML = '';

    Object.keys(accountBalance).forEach(acc => {
      const net = accountBalance[acc];
      if (Math.abs(net) < 0.01) return; // 淨額為 0 無須轉賬

      const li = document.createElement('li');
      li.className = 'settlement-item';

      if (acc === payerAccount) {
        li.innerHTML = `
          <span><strong>${acc}</strong> (付款方帳戶)</span>
          <span class="highlight-receive">應收取 $${net.toFixed(1)}</span>
        `;
      } else if (net < 0) {
        li.innerHTML = `
          <span><strong>${acc}</strong> 需轉賬給 <strong>${payerAccount}</strong></span>
          <span class="highlight-pay">需支付 $${Math.abs(net).toFixed(1)}</span>
        `;
      } else {
        li.innerHTML = `
          <span><strong>${acc}</strong></span>
          <span class="highlight-receive">應收取 $${net.toFixed(1)}</span>
        `;
      }
      resultsUl.appendChild(li);
    });

    document.getElementById('result-section').style.display = 'block';
  }

  // 初始化執行
  window.onload = initUI;
</script>

</body>
</html>
