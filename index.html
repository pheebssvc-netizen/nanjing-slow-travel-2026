<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>南京六日慢遊</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC",
                         "Microsoft JhengHei", sans-serif;
            background: #f7f3eb;
            color: #333;
        }

        header {
            padding: 50px 24px;
            text-align: center;
            background: #eee4d4;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        header p {
            margin: 6px 0;
            font-size: 18px;
        }

        main {
            max-width: 700px;
            margin: auto;
            padding: 24px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .card h2 {
            margin-top: 0;
            font-size: 23px;
        }

        .card p {
            font-size: 18px;
            line-height: 1.8;
        }

        .button {
            display: block;
            text-align: center;
            padding: 14px;
            margin-top: 14px;
            border-radius: 12px;
            background: #8b3a32;
            color: white;
            text-decoration: none;
            font-size: 18px;
        }
    </style>
</head>

<body>

<header>
    <h1>南京六日慢遊</h1>
    <p>2026.11.02 – 11.07</p>
    <p>7人｜60+輕鬆旅行</p>
</header>

<main>

    <div class="card">
        <h2>📅 今日行程</h2>
        <p>
            南京六日慢遊，上午完成核心行程，
            下午按團友體力及天氣自由安排。
        </p>
        <a class="button" href="#">查看今日行程</a>
    </div>

    <div class="card">
        <h2>📍 南京景點</h2>
        <p>
            明孝陵、南京博物院、總統府、
            雞鳴寺、玄武湖、瞻園……
        </p>
        <a class="button" href="#">查看景點資料</a>
    </div>

    <div class="card">
        <h2>🍜 南京美食</h2>
        <p>
            南京菜、鍋貼、鹽水鴨、湯包及各式地道小食。
        </p>
        <a class="button" href="#">查看美食</a>
    </div>

    <div class="card">
        <h2>ℹ️ 實用資料</h2>
        <p>
            酒店、交通、門票、預約、天氣及60+旅遊提示。
        </p>
        <a class="button" href="#">查看實用資料</a>
    </div>

</main>

</body>
</html>
