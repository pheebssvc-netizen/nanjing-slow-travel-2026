<title>下午去哪裡？｜南京六日慢遊</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    background: #f7f3ed;
    color: #403b36;
    line-height: 1.7;
}

header {
    background: linear-gradient(135deg, #647b6d, #879889);
    color: white;
    padding: 35px 20px 30px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 2px;
}

header p {
    margin: 8px 0 0;
    font-size: 15px;
    opacity: 0.95;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 20px 15px 50px;
}

.section-title {
    font-size: 21px;
    font-weight: bold;
    margin: 20px 0 12px;
}

.hint {
    font-size: 14px;
    color: #777;
    margin-bottom: 15px;
}

/* 選擇按鈕 */

.choice-group {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 22px;
}

.choice-btn {
    border: 1px solid #d8d0c6;
    background: white;
    border-radius: 14px;
    padding: 13px 8px;
    font-size: 15px;
    color: #514b45;
    cursor: pointer;
    transition: 0.2s;
}

.choice-btn:hover {
    transform: translateY(-2px);
}

.choice-btn.active {
    background: #657b6d;
    color: white;
    border-color: #657b6d;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
}

/* 推薦結果 */

.result-box {
    margin-top: 28px;
}

.result-title {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 14px;
}

.spot-card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    border-left: 5px solid #829584;
}

.spot-card h3 {
    margin: 0 0 7px;
    font-size: 20px;
}

.spot-card .subtitle {
    color: #7b746d;
    font-size: 14px;
    margin-bottom: 10px;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 10px 0;
}

.tag {
    background: #f0ece6;
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 13px;
}

.reason {
    background: #f7f4ef;
    border-radius: 12px;
    padding: 12px;
    margin: 12px 0;
    font-size: 14px;
}

.buttons {
    display: flex;
    gap: 9px;
    margin-top: 14px;
}

.buttons a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    padding: 10px 8px;
    border-radius: 10px;
    font-size: 14px;
}

.detail-btn {
    background: #eee8df;
    color: #504a43;
}

.map-btn {
    background: #657b6d;
    color: white;
}

.note {
    margin-top: 25px;
    background: #eee9df;
    border-radius: 15px;
    padding: 15px;
    font-size: 13px;
    color: #686159;
}

.back {
    display: block;
    text-align: center;
    margin-top: 30px;
    color: #657b6d;
    text-decoration: none;
    font-size: 14px;
}

/* 手機 */

@media (max-width: 600px) {

    header {
        padding: 28px 15px 25px;
    }

    header h1 {
        font-size: 25px;
    }

    .choice-group {
        grid-template-columns: repeat(2, 1fr);
    }

    .choice-btn {
        min-height: 58px;
        font-size: 14px;
    }

    .spot-card {
        padding: 17px;
    }

    .spot-card h3 {
        font-size: 19px;
    }

    .buttons a {
        font-size: 13px;
    }
}
</style>
</head>

<body>

    <p>南京六日慢遊 · 按今日體力、天氣及興趣自由選擇</p>
</header>

<div class="container">

    <div class="section-title">🌿 今日體力</div>
    <div class="hint">食完午飯後，大家覺得今日有幾多「漫遊」能量？</div>

    <div class="choice-group" id="energyGroup">

    <div class="section-title">🎯 今日想玩</div>

    <div class="choice-group" id="interestGroup">

        <button class="choice-btn" data-value="art">🎨 藝術</button>

    <div class="result-box">

        <div class="result-title">

        <div id="results"></div>

    </div>

    <div class="note">
        💡 <strong>小提示：</strong><br>
        呢個頁面唔係要大家「一定照行」，
        而係方便團友午飯後按當日實際情況，
        輕鬆揀一個最舒服嘅下午行程。
    </div>

    <a class="back" href="index.html">

</div>

    reason:
    "景點規模不大，約30分鐘即可完成，非常適合作為下午加插行程。參觀後可以繼續留在夫子廟、秦淮河一帶慢慢散步。",
    page: "spots.html"

{
    name: "玄武湖",
    subtitle: "金陵明珠 · 南京秋色代表",
    energy: "medium",

    walk: "🚶 步行難度：中",
    weatherScore: "☔ 雨天適合度：★★☆☆☆",

    energy: "medium",

    walk: "🚶 步行難度：中",
    weatherScore: "☔ 雨天適合度：★★☆☆☆",

    "如果大家對歷史文化、寺院及秋色有興趣，可以將雞鳴寺與玄武湖一併安排。11月銀杏及秋色尤其漂亮，但部分路段需要步行。",

    energy: "medium",
    weather: ["sunny","cloudy"],
    interests: ["history","oldtown","walk"],
    walk: "🚶 步行難度：中～高",

    page: "spots.html"

},

{

    energy: "high",
    weather: ["sunny","cloudy"],
    interests: ["history","oldtown","walk"],
    walk: "🚶 步行難度：中",
    weatherScore: "☔ 雨天適合度：★★☆☆☆",
    distance: "🚗 酒店：約 1–1.5 小時車程",
    reason:
    "如果大家精神很好，而且想離開南京市中心感受古鎮生活，可以安排高淳。路程較遠，因此更加適合獨立安排一日遊。",
    page: "spots.html"
},

{
    name: "漆橋古村",
    subtitle: "江南孔子第一村",
    energy: "high",
    weather: ["sunny","cloudy"],
    interests: ["history","oldtown","walk"],
    walk: "🚶 步行難度：中",
    weatherScore: "☔ 雨天適合度：★★☆☆☆",
    distance: "🚗 高淳老街：約 25 分鐘車程",
    reason:
    "商業化程度低，適合喜歡原生態古村嘅團友。最理想係同高淳老街一齊安排，而唔建議單獨從南京市區前往。",
    page: "spots.html"
}

];


/* =========================
   當前選擇
========================= */

let currentEnergy = "low";
let currentWeather = "sunny";
let currentInterest = "history";


/* =========================
   按鈕控制
========================= */

function setupGroup(groupId, callback) {

    const buttons =
        document.querySelectorAll("#" + groupId + " .choice-btn");

    buttons.forEach(button => {

        button.addEventListener("click", function() {

            buttons.forEach(btn =>
                btn.classList.remove("active")
            );

            this.classList.add("active");

            callback(this.dataset.value);

            showResults();
        });

    });

}


setupGroup("energyGroup", value => {
    currentEnergy = value;
});

setupGroup("weatherGroup", value => {
    currentWeather = value;
});

setupGroup("interestGroup", value => {
    currentInterest = value;
});


/* =========================
   推薦邏輯
========================= */

function calculateScore(spot) {

    let score = 0;

    /* 體力 */

    if (spot.energy === currentEnergy) {
        score += 4;
    }

    if (
        currentEnergy === "low" &&
        spot.energy === "medium"
    ) {
        score += 1;
    }

    if (
        currentEnergy === "high" &&
        spot.energy === "medium"
    ) {
        score += 2;
    }

    /* 天氣 */

    if (spot.weather.includes(currentWeather)) {
        score += 3;
    }

    /* 興趣 */

    if (spot.interests.includes(currentInterest)) {
        score += 5;
    }

    return score;
}


/* =========================
   顯示結果
========================= */

function showResults() {

    const results =
        spots
        .map(spot => ({
            ...spot,
            score: calculateScore(spot)
        }))
        .sort((a,b) => b.score - a.score)
        .slice(0,3);

    const container =
        document.getElementById("results");

    container.innerHTML = "";

    results.forEach((spot,index) => {

        const card =
        document.createElement("div");

        card.className = "spot-card";

        const star =
            index === 0 ? "🥇" :
            index === 1 ? "🥈" : "🥉";

        card.innerHTML = `

            <h3>${star} ${spot.name}</h3>

            <div class="subtitle">
                ${spot.subtitle}
            </div>

            <div class="tags">

                <span class="tag">
                    ${spot.walk}
                </span>

                <span class="tag">
                    ${spot.weatherScore}
                </span>

                <span class="tag">
                    ${spot.distance}
                </span>

            </div>

            <div class="reason">
                <strong>💡 點解今日適合：</strong><br>
                ${spot.reason}
            </div>

            <div class="buttons">

                <a
                    class="detail-btn"
                    href="${spot.page}">
                    📖 完整導遊資料
                </a>

                <a
                    class="map-btn"
                    target="_blank"
                    href="https://uri.amap.com/search?keyword=${encodeURIComponent(spot.name)}">
                    🗺️ 高德導航
                </a>

            </div>
        `;

        container.appendChild(card);

    });

}


/* =========================
   初始顯示
========================= */

showResults();

</script>
